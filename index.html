<style>

:root{
--cream:#f7f3ee;
--sage:#9caf9b;
--sage-dark:#55635a;
--sage-soft:#dfe7df;
--text:#4b4f4a;
--white-glass: rgba(255, 252, 246, 0.92);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:'Montserrat',sans-serif;
background:
linear-gradient(rgba(247,243,238,0.18),rgba(247,243,238,0.18)),
url("foto2.jpg") center/cover fixed no-repeat;
color:var(--text);
overflow-x:hidden;
letter-spacing:.2px;
}

/* LANGUAGE */

#languageModal{
position:fixed;
inset:0;
background:
linear-gradient(rgba(247,243,238,0.93),rgba(247,243,238,0.93)),
url("foto1.jpg") center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
backdrop-filter:blur(4px);
}

#languageModal h2{
font-family:'Cormorant Garamond',serif;
font-size:3.4rem;
font-weight:500;
margin-bottom:35px;
color:var(--sage-dark);
letter-spacing:1px;
}

.language-buttons{
display:flex;
gap:14px;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}

.language-buttons button{
padding:13px 24px;
border:none;
border-radius:999px;
background:rgba(156,175,155,0.92);
color:white;
font-size:.95rem;
font-weight:500;
cursor:pointer;
transition:.35s;
backdrop-filter:blur(10px);
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.language-buttons button:hover{
background:var(--sage-dark);
transform:translateY(-2px);
}

/* HERO */

.hero{
position:relative;
width:100%;
min-height:100vh;
height:100vh;
background:
linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.25)),
url("foto1.jpg");
background-size:cover;
background-repeat:no-repeat;
background-position:center top;
display:flex;
flex-direction:column;
justify-content:flex-end;
align-items:center;
text-align:center;
padding:60px 20px;
color:white;
overflow:hidden;
}

.hero h1{
font-family:'Montserrat',sans-serif;
font-size:clamp(1.2rem, 3.5vw, 2.5rem);
font-weight:400;
line-height:1;
letter-spacing:2px;
text-shadow:0 4px 18px rgba(0,0,0,0.25);
margin-bottom:15px;
}

.hero .names{
font-size:clamp(0.9rem, 2.5vw, 1.2rem);
letter-spacing:2px;
margin-top:14px;
}

.hero .date{
font-family:'Montserrat',sans-serif;
font-size:clamp(1.2rem, 3.5vw, 2.5rem);
font-weight:400;
letter-spacing:2px;
text-shadow:0 4px 14px rgba(0,0,0,0.25);
margin-top:18px;
}

/* MARCO ELEGANTE */

.hero::before{
content:"";
position:absolute;
inset:18px;
border:1.5px solid rgba(255,255,255,0.55);
border-radius:34px;
pointer-events:none;
box-shadow:
0 0 0 1px rgba(255,255,255,0.15),
0 25px 60px rgba(0,0,0,0.22);
}

/* BRILLO */

.hero::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
180deg,
rgba(255,255,255,0.04) 0%,
rgba(255,255,255,0) 30%,
rgba(0,0,0,0.12) 100%
);
pointer-events:none;
}

.hero h1,
.hero .names,
.hero .date{
position:relative;
z-index:2;
}

/* MUSIC */

#musicToggle{
position:fixed;
right:18px;
bottom:18px;
width:58px;
height:58px;
border:none;
border-radius:50%;
background:rgba(156,175,155,0.92);
color:white;
font-size:1.2rem;
cursor:pointer;
z-index:999;
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.18);
transition:.3s;
}

#musicToggle:hover{
transform:scale(1.08);
background:var(--sage-dark);
}

/* SECTIONS */

section{
width:100%;
max-width:1120px;
margin:0 auto;
padding:12px 20px;
}

.section-title{
font-family:'Cormorant Garamond',serif;
font-size:3rem;
font-weight:500;
text-align:center;
margin-bottom:26px;
color:var(--sage-dark);
letter-spacing:.5px;
}

/* CARDS GENERALES */

.timer-card,
.story-box,
.card,
.gift-card{
width:100%;
max-width:100%;
}

/* COUNTDOWN */

.timer-card{
margin:auto;
background:var(--white-glass);
padding:28px;
border-radius:26px;
text-align:center;
backdrop-filter:blur(14px);
box-shadow:0 10px 35px rgba(0,0,0,0.08);
border:1px solid rgba(255,255,255,0.45);
}

#timer{
font-size:1.35rem;
font-weight:600;
color:var(--sage-dark);
margin-top:5px;
letter-spacing:1px;
}

/* STORY */

.story-box{
background:var(--white-glass);
padding:24px;
border-radius:26px;
line-height:2;
font-size:1.02rem;
text-align:center;
backdrop-filter:blur(14px);
box-shadow:0 10px 35px rgba(0,0,0,0.08);
border:1px solid rgba(255,255,255,0.45);
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:0;
}

/* CARD */

.card{
background:var(--white-glass);
padding:24px;
border-radius:26px;
text-align:center;
backdrop-filter:blur(14px);
box-shadow:0 10px 35px rgba(0,0,0,0.08);
border:1px solid rgba(255,255,255,0.45);
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
}

.card h3{
font-family:'Cormorant Garamond',serif;
font-size:2rem;
font-weight:500;
margin-bottom:12px;
color:var(--sage-dark);
}

.card p{
line-height:1.75;
font-size:.97rem;
}

/* IMAGES */

.icon-image{
width:100px;
height:100px;
object-fit:cover;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.12);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:20px;
margin-top:18px;
}

/* BUTTONS */

.btn{
display:inline-block;
margin-top:18px;
padding:12px 24px;
background:var(--sage);
color:white;
text-decoration:none;
font-size:.9rem;
font-weight:500;
letter-spacing:.8px;
border:none;
outline:none;
border-radius:999px;
cursor:pointer;
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
box-shadow:0 8px 18px rgba(0,0,0,0.08);
transition:.3s;
}

.btn:hover{
background:var(--sage-dark);
transform:translateY(-2px);
}

.btn:focus,
.btn:active{
outline:none;
border:none;
box-shadow:0 8px 18px rgba(0,0,0,0.08);
}

/* MAP */

iframe{
width:100%;
height:220px;
border:none;
border-radius:20px;
margin-top:16px;
filter:saturate(.9);
}

/* FAQ */

.faq-item{
margin-bottom:20px;
text-align:left;
}

.faq-item h4{
margin-bottom:8px;
color:var(--sage-dark);
font-size:1rem;
}

/* GIFTS */

.gift-card{
margin:auto;
}

.bank-container{
display:flex;
/*  font-family:'Cormorant Garamond',serif;*/
justify-content:center;
gap:16px;
flex-wrap:wrap;
margin-top:18px;
}

.bank-box{
background:rgba(255,255,255,0.65);
padding:18px;
border-radius:22px;
width:300px;
text-align:center;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.5);
}

#ibanText{
white-space:nowrap;
font-size:.85rem;
}

/* FOOTER */

footer{
text-align:center;
padding:50px 20px;
background:rgba(255,255,255,0.42);
backdrop-filter:blur(10px);
color:#3c433d;
font-size:.95rem;
}

footer small{
display:block;
margin-top:8px;
opacity:.75;
}

/* MOBILE */

@media (max-width:950px){

section{
padding:8px 12px;
}

.grid{
grid-template-columns:1fr;
gap:8px;
}

.story-box{
padding:18px;
}

}

@media (max-width:768px){

body{
background-attachment:scroll;
background-position:center center;
background-size:cover;
}

.hero{
background-position:70% center;
height:100svh;
min-height:100svh;
}

section{
padding:8px 12px;
}

.grid{
grid-template-columns:1fr;
gap:8px;
}

.card{
padding:18px;
}

.story-box{
padding:18px;
}

.section-title{
font-size:2.2rem;
margin-bottom:12px;
}

}

@media (min-width:769px){

.hero{
background-position:center 20%;
}

}

@media (min-width:1400px){

.hero{
background-position:center 15%;
}

}

</style>
</head>

function setLang(lang){

currentLang = lang;

document.getElementById("languageModal").style.display="none";

const music=document.getElementById("bgMusic");

music.volume=0.25;

music.play().catch(()=>{});

const t=translations[lang] || translations.es;

Object.keys(t).forEach(id=>{

const el=document.getElementById(id);

if(el){
el.innerHTML=t[id];
}

});

updateCountdown();

}

function toggleMusic(){

const music=document.getElementById("bgMusic");

if(music.paused){
music.play();
}else{
music.pause();
}

}

const targetDate=new Date("2026-09-26T18:30:00");

function updateCountdown(){


  const now = new Date();
  const target = new Date("2026-09-26T18:30:00");

  let years = target.getFullYear() - now.getFullYear();
  let months = target.getMonth() - now.getMonth();
  let days = target.getDate() - now.getDate();
  let hours = target.getHours() - now.getHours();

  if (hours < 0) {
    hours += 24;
    days--;
  }

  if (days < 0) {
    const prevMonth = new Date(target.getFullYear(), target.getMonth(), 0).getDate();
    days += prevMonth;
    months--;
  }

  if (months < 0) {
    months += 12;
    years--;
  }

  const t = translations[currentLang] || translations.es;

  const totalMonths = years * 12 + months;

  document.getElementById("timer").innerHTML =
    `${totalMonths} ${t.months} · ${days} ${t.days} · ${hours} ${t.hours}`;

}

setInterval(updateCountdown,1000);

function copyIBAN(){

navigator.clipboard.writeText(
document.getElementById("ibanText").innerText
);

showCopied();

}

function copySWIFT(){

navigator.clipboard.writeText(
document.getElementById("swiftText").innerText
);

showCopied();

}
  function copyNAME(){

  navigator.clipboard.writeText(
    "Hyo Hwan Cho & Patricia Candel Cano"
  );

  showCopied();
}

function showCopied(){

const msg=document.getElementById("copyMessage");

msg.innerHTML = translations[currentLang].copied;

msg.style.opacity="1";

setTimeout(()=>{
msg.style.opacity="0";
},2000);

}

updateCountdown();



</script>
