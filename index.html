<script>

/* AQUÍ VAN TODAS LAS TRADUCCIONES Y FUNCIONES */
/* DEMASIADO LARGO PARA ENTRAR EN UN SOLO MENSAJE */

/* IMPORTANTE:
1. Mantén exactamente este HTML
2. Usa las traducciones del bloque anterior que ya te pasé
3. Solo sustituye el bloque translations completo */

let currentLang = "es";

const translations = {


es:{
heroTitle:"¡¡¡NOS CASAMOS!!!",
heroDate:"26 · SEPTIEMBRE · 2026",
countdownTitle:"Cuenta atrás",
months:"meses",
days:"días",
hours:"horas",
copied:"✓ Copiado",
storyTitle:"Nuestra Historia",
storyText:"Dos caminos completamente distintos terminaron cruzándose en el momento perfecto. Entre viajes, aviones, conversaciones infinitas y sobrevivir en Charleroi (que no es poco!), Patricia e Hyo Hwan han ido construyendo su historia entre gofres y patatas fritas y ahora quieren celebrar el comienzo de esta nueva etapa rodeados de las personas que más quieren. Vámonos de fiesta!!",
ceremonyTitle:"Ceremonia",
ceremonyText:"Finca Siempre Verde · Murcia",
celebrationTitle:"Celebración🥂",
celebrationText1:"Cena & Fiesta",
celebrationText2:"Hasta el amanecer ✨🌅",
confirmTitle:"Confirmación",
confirmText:"Nos haría muchísima ilusión compartir este día contigo. Si no confirmas antes del <b>1 de septiembre</b>, entenderemos que lamentablemente no puedes acompañarnos y tendrás que conformarte con llorar mientras ves las fotos de la fiesta del año.",
confirmBtn:"CONFIRMACIÓN Y SELECCIÓN DE MENÚ",
travelTitle:"Cómo llegar",
travelText:"Aeropuertos cercanos ✈️: Alicante & Murcia<br><br>Taxi 🚖 · Uber · Cabify · Bolt<br><br>Parking disponible en la finca",
stayTitle:"Alojamiento",
stayText1:"Si no tienes la suerte de vivir en Murcia y tienes que buscar alojamiento para el finde, hemos conseguido descuentos especiales para invitados en hoteles cercanos, claro que siempre podéis buscar por Airbnb o booking.",
hotelBtn:"VER HOTEL",
cetinaBtn:"VER CETINA",
musicTitle:"Música",
musicText:"Añade canciones a nuestra playlist colaborativa para la fiesta 🕺💃",
playlistBtn:"ABRIR PLAYLIST",
timelineTitle:"Horario del día",
timeline1:"Ceremonia",
timeline2:"Cóctel",
timeline3:"Cena",
faqTitle:"Preguntas frecuentes",
faq1q:"👬👫👭¿Puedo ir con acompañante?",
faq1a:" Claro! Pero sólo si nos lo has indicado en la invitación (si no le tocará sentarse en el suelo y comer de tu plato 🙃)",
faq2q:"🚘¿Hay parking?",
faq2a:"Sí, dentro de la finca.",
faq3q:"👗👔¿Hay dress code obligatorio?",
faq3a:"No, pero ponte guapete que nunca se sabe 😉",
faq4q:"🏩¿La ceremonia y celebración son en el mismo lugar?",
faq4a:"Sí, todo será en la misma finca.",
giftTitle:"Regalos",
giftQuote:"El mejor regalo es compartir este día con vosotros, pero si queréis ayudarnos a comenzar esta nueva aventura, podéis hacerlo aquí ",
copyIbanBtn:"COPIAR IBAN",
copySwiftBtn:"COPIAR SWIFT",
footerText:"Hecho con amor · Patricia & Hyo Hwan",
footerSmall:"(y un poco de ayuda de ChatGPT...)"
},
  
4


};

function setLang(lang){

currentLang = lang;

document.getElementById("languageModal").style.display="none";

const music=document.getElementById("bgMusic");

music.volume=0.25;

music.play().catch(()=>{});

const t=translations[lang] || translations.es;

Object.keys(t).forEach(id=>{

const el=document.getElementById(id);

if(el){
el.innerHTML=t[id];
}

});

updateCountdown();

}

function toggleMusic(){

const music=document.getElementById("bgMusic");

if(music.paused){
music.play();
}else{
music.pause();
}

}

const targetDate=new Date("2026-09-26T18:30:00");

function updateCountdown(){

const now=new Date();

const diff=targetDate-now;

const months=Math.floor(diff/(1000*60*60*24*30));
const days=Math.floor((diff/(1000*60*60*24))%30);
const hours=Math.floor((diff/(1000*60*60))%24);

const t = translations[currentLang] || translations.es;

document.getElementById("timer").innerHTML=
`${months} ${t.months} · ${days} ${t.days} · ${hours} ${t.hours}`;

}

setInterval(updateCountdown,1000);

function copyIBAN(){

navigator.clipboard.writeText(
document.getElementById("ibanText").innerText
);

showCopied();

}

function copySWIFT(){

navigator.clipboard.writeText(
document.getElementById("swiftText").innerText
);

showCopied();

}

function showCopied(){

const msg=document.getElementById("copyMessage");

msg.innerHTML = translations[currentLang].copied;

msg.style.opacity="1";

setTimeout(()=>{
msg.style.opacity="0";
},2000);

}

updateCountdown();



</script>
