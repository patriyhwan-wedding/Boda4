<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patricia & Hyo Hwan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Montserrat',sans-serif;
  color:white;
  overflow-x:hidden;
  background:
  linear-gradient(rgba(0,0,0,0.70),rgba(0,0,0,0.70)),
  url('foto2.jpg') center/cover fixed no-repeat;
}

/* ⬆️ TIMER MÁS ARRIBA */
#timer{
  font-size:1.3rem;
  margin-bottom:85px;
  letter-spacing:3px;
  background:rgba(0,0,0,0.25);
  padding:12px 24px;
  border-radius:999px;
  backdrop-filter:blur(10px);
}

/* ⬇️ BAJAR TEXTO HERO (subtítulo más abajo visualmente) */
.hero p{
  margin-top:18px;
  letter-spacing:5px;
  text-transform:uppercase;
}

#language-selector{
  position:fixed;inset:0;
  background:#111;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#language-selector h2{
  font-family:'Cormorant Garamond',serif;
  font-size:3rem;
  margin-bottom:40px;
}

.lang-buttons{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}

.lang-btn{
  padding:14px 28px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.08);
  color:white;
  cursor:pointer;
}

.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  padding:20px;
  background:
  linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.45)),
  url('foto1.jpg') center/cover no-repeat;
}

.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(4rem,10vw,7rem);
}

section{max-width:1100px;margin:auto;padding:100px 25px;}

.section-title{
  font-family:'Cormorant Garamond',serif;
  font-size:3rem;
  text-align:center;
  margin-bottom:25px;
}

.intro{text-align:center;max-width:750px;margin:auto;line-height:1.8;}

.details-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
  margin-top:60px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:24px;
  padding:40px;
  text-align:center;
  backdrop-filter:blur(12px);
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:14px 34px;
  border-radius:999px;
  background:white;
  color:black;
  text-decoration:none;
}

footer{
  text-align:center;
  padding:40px;
  color:#ccc;
}

</style>
</head>

<body>

<div id="language-selector">
<h2>Choose Language</h2>
<div class="lang-buttons">
<button onclick="setLanguage('es')">Español</button>
<button onclick="setLanguage('en')">English</button>
<button onclick="setLanguage('fr')">Français</button>
<button onclick="setLanguage('it')">Italiano</button>
<button onclick="setLanguage('kr')">한국어</button>
</div>
</div>

<section class="hero">
<div>

<div id="timer"></div>

<p id="heroSubtitle">WE ARE GETTING MARRIED</p>
<h1>Patricia & Hyo Hwan</h1>
<p id="dateText">26 · September · 2026</p>

</div>
</section>

<section>
<h2 class="section-title" id="storyTitle"></h2>
<p class="intro" id="storyText"></p>
</section>

<section>

<h2 class="section-title" id="detailsTitle"></h2>

<div class="details-grid">

<div class="card">
<h3 id="ceremonyTitle"></h3>
<p id="ceremonyTime">17:30h</p>
<p id="ceremonyPlace"></p>
</div>

<div class="card">
<h3 id="partyTitle"></h3>
<p id="partyText1"></p>
<p id="partyText2"></p>
</div>

<div class="card">
<h3 id="dressTitle"></h3>
<p id="dressText1"></p>
<p id="dressText2"></p>
</div>

</div>

<div class="details-grid">

<div class="card">

<h3 id="stayTitle"></h3>
<p id="stayText"></p>

<p id="hotel1Title"></p>
<p>15%</p>

<a class="btn" target="_blank"
href="Descuentos en hotel para vosotros.pdf"
id="hotel1Btn"></a>

<p style="margin-top:20px;"></p>

<p id="hotel2Title"></p>
<p>20%</p>

<a class="btn" target="_blank"
href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf"
id="hotel2Btn"></a>

</div>

<div class="card">

<h3 id="musicTitle"></h3>
<p id="musicText"></p>

<a class="btn" target="_blank"
href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe"
id="musicBtn"></a>

</div>

</div>

</section>

<section>

<h2 class="section-title" id="confirmTitle"></h2>

<div style="text-align:center;">
<a class="btn" target="_blank"
href="https://forms.gle/VbBLwKAwJP2qk6uT9"
id="confirmBtn"></a>
</div>

</section>

<footer id="footer"></footer>

<audio id="bg-music" loop>
<source src="Lavieenrose.mp3">
</audio>

<script>

hotel1Title:"Hotel Amistad Murcia",

function setLanguage(lang){

document.getElementById("language-selector").style.display="none";

Object.keys(translations[lang]).forEach(id=>{
const el=document.getElementById(id);
if(el) el.innerHTML = translations[lang][id];
});

const audio=document.getElementById("bg-music");
audio.volume=0.25;
audio.play().catch(()=>{});

}

const weddingDate=new Date("September 26, 2026 17:30:00").getTime();

setInterval(()=>{
const now=Date.now();
const d=weddingDate-now;

document.getElementById("timer").innerHTML =
Math.floor(d/86400000)+" days · "+
Math.floor(d%86400000/3600000)+"h · "+
Math.floor(d%3600000/60000)+"m";

},1000);

</script>

</body>
</html>
