body.no-scroll{

#language-selector{

}

#language-selector.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#language-selector h2{
  font-family:'Cormorant Garamond',serif;
  font-size:3.2rem;
  margin-bottom:40px;
  font-weight:500;
  color:var(--eucalyptus-dark);
}

.lang-buttons{
  display:flex;

  justify-content:center;
  gap:15px;
  padding:20px;
}

.lang-btn{
  padding:14px 30px;
  border-radius:999px;
  border:none;
  background:rgba(139,163,145,0.18);
  color:var(--eucalyptus-dark);
  cursor:pointer;
  font-size:1rem;
  transition:.3s;
  backdrop-filter:blur(10px);
  font-weight:500;
}

.lang-btn:hover{
  background:var(--eucalyptus);

}

.hero{

  display:flex;
  justify-content:center;
  align-items:flex-start;
  text-align:center;
  position:relative;
  padding-top:230px;
  padding-left:20px;
  padding-right:20px;
  background:
  linear-gradient(rgba(214,226,217,0.28),rgba(246,241,231,0.34)),
  url('foto1.jpg') center center/cover no-repeat;
}

.hero::after{
  content:'';
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:180px;
  background:linear-gradient(to top,var(--cream),transparent);
}

.hero-content{
  width:100%;
  position:relative;
  z-index:2;
}

#timer{
  font-size:1.2rem;
  margin-bottom:140px;
  letter-spacing:2px;
  background:rgba(255,255,255,0.55);
  padding:14px 30px;
  border-radius:999px;
  backdrop-filter:blur(10px);
  display:inline-block;
  color:var(--eucalyptus-dark);
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(4rem,10vw,7rem);
  font-weight:500;
  letter-spacing:3px;
  color:#ffffff;
  text-shadow:0 4px 20px rgba(0,0,0,0.18);
}

.hero p{
  margin-top:18px;
  letter-spacing:5px;
  text-transform:uppercase;
  color:#ffffff;
  text-shadow:0 2px 10px rgba(0,0,0,0.18);
}

section{

.section-title{

.intro{

.details-grid{

  margin-top:70px;
}

.card{

function setLanguage(lang){

  .getElementById("language-selector")
  .classList.add("hidden");

  document.body.classList.remove("no-scroll");

  Object.keys(translations[lang]).forEach(id=>{

    const el = document.getElementById(id);

    if(el){
      el.innerHTML = translations[lang][id];
    }

  });

  audio.muted = false;

  audio.play().catch(()=>{});

}

function copyIBAN(){

const iban =
document.getElementById("ibanText").innerText;

navigator.clipboard.writeText(iban);

showCopiedMessage();

}

function copySWIFT(){

const swift =
document.getElementById("swiftText").innerText;

navigator.clipboard.writeText(swift);

showCopiedMessage();

}

function showCopiedMessage(){

const msg =
document.getElementById("copyMessage");

msg.style.opacity = "1";

setTimeout(()=>{
msg.style.opacity = "0";
},2000);

}

const weddingDate =
new Date("September 26, 2026 17:30:00").getTime();

setInterval(()=>{

const now = new Date().getTime();

const distance = weddingDate - now;

const totalDays =
Math.floor(distance / (1000 * 60 * 60 * 24));

const months =
Math.floor(totalDays / 30);

const days =
totalDays % 30;

const hours =
Math.floor(
(distance % (1000*60*60*24)) /
(1000*60*60)
);

 document.getElementById("timer").innerHTML =
 `${months} months · ${days} days · ${hours}h`;

},1000);

</script>
