<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyo Hwan & Patricia</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --cream:#f6f1e7;
  --green:#8ba391;
  --green-dark:#2f3b31;
  --text:#2f3b31;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Montserrat,sans-serif;
  color:var(--text);
  background:
    linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)),
    url("foto2.jpg") center/cover fixed no-repeat;
}

/* MODAL IDIOMA */
#langModal{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.97);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#langModal h2{
  font-family:"Cormorant Garamond";
  font-size:2.8rem;
  margin-bottom:20px;
}

#langModal button{
  margin:8px;
  padding:12px 20px;
  border-radius:999px;
  border:none;
  background:var(--green);
  color:white;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  text-align:center;
  padding-top:120px;
  background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.35)),
    url("foto1.jpg") center/cover no-repeat;
}

.hero h1{
  font-family:"Cormorant Garamond";
  font-size:4.2rem;
  color:white;
}

.hero p{
  color:white;
  letter-spacing:3px;
}

/* COUNTDOWN */
#timer{
  margin-top:20px;
  padding:10px 18px;
  background:rgba(255,255,255,0.75);
  border-radius:999px;
}

/* TEXTO HERO ABAJO (NO TAPAR CARA) */
.hero-bottom{
  margin-top:auto;
  padding-bottom:30px;
  color:white;
  font-size:0.95rem;
  opacity:0.9;
  max-width:700px;
}

/* SECCIONES */
section{
  max-width:1100px;
  margin:auto;
  padding:80px 20px;
}

.title{
  text-align:center;
  font-size:2.7rem;
  font-family:"Cormorant Garamond";
  margin-bottom:20px;
}

/* GRID TARJETAS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.8);
  padding:22px;
  border-radius:18px;
}

/* IMAGENES */
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:14px;
  margin-top:10px;
}

/* MAPA */
iframe{
  width:100%;
  height:200px;
  border:none;
  border-radius:14px;
  margin-top:10px;
}

/* BOTONES */
.btn{
  margin-top:12px;
  padding:12px 20px;
  background:var(--green);
  color:white;
  border-radius:999px;
  display:inline-block;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
  color:var(--text);
}

</style>
</head>

<body>

<!-- LANGUAGE MODAL -->
<div id="langModal">
  <h2>Select language</h2>
  <button onclick="setLang('es')">Español</button>
  <button onclick="setLang('en')">English</button>
  <button onclick="setLang('fr')">Français</button>
  <button onclick="setLang('it')">Italiano</button>
  <button onclick="setLang('kr')">한국어</button>
</div>

<!-- HERO -->
<div class="hero">

<div id="timer"></div>

<h1>¡¡¡NOS CASAMOS!!!</h1>
<p>Hyo Hwan & Patricia</p>
<p>26 · Septiembre · 2026</p>

<div class="hero-bottom" id="introText"></div>

</div>

<!-- HISTORIA -->
<section>
<h2 class="title" id="t_story"></h2>
<p class="card" id="story"></p>
</section>

<!-- INFO -->
<section>
<div class="grid">

<div class="card">
<h3 id="t_ceremony"></h3>
<p>18:30h</p>
<p>Finca Siempre Verde</p>
<iframe src="https://www.google.com/maps?q=Finca%20Siempre%20Verde%20Murcia&output=embed"></iframe>
</div>

<div class="card">
<h3 id="t_party"></h3>
<p id="party_time"></p>
<img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf">
</div>

<div class="card">
<h3 id="t_dress"></h3>
<p id="dress_text"></p>
<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1">
</div>

</div>
</section>

<!-- ALOJAMIENTO -->
<section>
<div class="card">
<h3 id="t_hotel"></h3>

<p id="hotel_text"></p>

<p><b>Hotel Amistad Murcia</b> - SIEMPREVERDEAMISTAD</p>
<a class="btn">VER HOTEL</a>

<p><b>Cetina Murcia</b> - EVENTOSPREMIER</p>
<a class="btn">VER PDF</a>
</div>
</section>

<!-- MUSICA -->
<section>
<div class="card">
<h3 id="t_music"></h3>
<a class="btn" href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe">ABRIR PLAYLIST</a>
</div>
</section>

<!-- CONFIRMACION -->
<section>
<div class="card">
<h3 id="t_confirm"></h3>
<p id="confirm_text"></p>
<a class="btn">CONFIRMAR ASISTENCIA Y MENÚ</a>
</div>
</section>

<!-- FOOTER -->
<footer id="footerText"></footer>

<audio id="music" autoplay loop>
<source src="Lavieenrose.mp3">
</audio>

<script>

function setLang(l){
document.getElementById("langModal").style.display="none";

const t={
es:{
t_story:"Nuestra Historia",
story:"Dos caminos completamente distintos terminaron cruzándose en el momento perfecto. Entre viajes, aviones, conversaciones infinitas y sobrevivir en Charleroi (que no es poco!), Patricia e Hyo Hwan han ido construyendo su historia entre gofres y patatas fritas y ahora quieren celebrar el comienzo de esta nueva etapa rodeados de las personas que más quieren.",
t_ceremony:"Ceremonia",
t_party:"Celebración",
party_time:"Cena 21:00–21:30 · Hasta el amanecer ✨",
t_dress:"Dress Code",
dress_text:"Libre · Lo importante es celebrar juntos ✨",
t_hotel:"Alojamiento",
hotel_text:"Hemos conseguido descuentos especiales para invitados en hoteles cercanos.",
t_music:"Música",
t_confirm:"Confirmación",
confirm_text:"Nos haría muchísima ilusión compartir este día contigo. Si no confirmas antes del 1 de septiembre, entenderemos que no puedes acompañarnos."
}
};

const langData=t[l];

Object.keys(langData).forEach(k=>{
const el=document.getElementById(k);
if(el) el.innerHTML=langData[k];
});
}

/* COUNTDOWN */
const target=new Date("2026-09-26T18:30:00");

setInterval(()=>{
const now=new Date();
const d=target-now;

const m=Math.floor(d/1000/60/60/24/30);
const days=Math.floor((d/1000/60/60/24)%30);
const h=Math.floor((d/1000/60/60)%24);

document.getElementById("timer").innerText=
`${m} meses · ${days} días · ${h}h`;
},1000);

/* MUSIC FIX */
window.addEventListener("click",()=>{
document.getElementById("music").play();
},{once:true});

</script>

</body>
</html>
