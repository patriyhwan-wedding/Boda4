align-items:center;

#languageModal h2{

font-weight:500;
margin-bottom:35px;
color:var(--sage-dark);
letter-spacing:1px;
}

.language-buttons{
display:flex;
gap:14px;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}

.language-buttons button{
padding:13px 24px;
border:none;
border-radius:999px;
background:rgba(156,175,155,0.92);
color:white;
font-size:.95rem;
font-weight:500;
cursor:pointer;
transition:.35s;
backdrop-filter:blur(10px);

}

.language-buttons button:hover{
background:var(--sage-dark);

}

.hero{
position:relative;
min-height:100vh;
width:100vw;
margin-left:calc(50% - 50vw);

background:

url("foto1.jpg") center 100% / cover no-repeat;

display:flex;
flex-direction:column;
justify-content:flex-end;
align-items:center;
text-align:center;

padding:60px 20px 55px;
color:white;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
inset:18px;
border:1.5px solid rgba(255,255,255,0.55);
border-radius:34px;
pointer-events:none;
box-shadow:
0 0 0 1px rgba(255,255,255,0.15),
0 25px 60px rgba(0,0,0,0.22);
}

/* BRILLO SUAVE */

.hero::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
180deg,
rgba(255,255,255,0.04) 0%,
rgba(255,255,255,0) 30%,
rgba(0,0,0,0.12) 100%
);
pointer-events:none;
}

.hero h1,
.hero .names,
.hero .date{
position:relative;
z-index:2;
}

.hero h1{
font-family:'Montserrat',sans-serif;
font-size:clamp(1.2rem, 3.5vw, 2.5rem);
font-weight:400;
line-height:1;
letter-spacing:2px;
text-shadow:0 4px 18px rgba(0,0,0,0.25);
margin-bottom:15px;
}

.hero .names{
font-size:clamp(0.9rem, 2.5vw, 1.2rem);
letter-spacing:2px;
margin-top:14px;
}

.hero .date{
font-size:clamp(1.2rem, 3.5vw, 2.5rem);
font-weight:400;
letter-spacing:2px;
text-shadow:0 4px 14px rgba(0,0,0,0.25);
margin-top:18px;
}

#musicToggle{
position:fixed;
right:18px;
bottom:18px;
width:58px;
height:58px;

border-radius:50%;

color:white;
font-size:1.2rem;
cursor:pointer;
z-index:999;
backdrop-filter:blur(10px);

transition:.3s;
}

#musicToggle:hover{
transform:scale(1.08);
background:var(--sage-dark);
}

max-width:1120px;
margin:auto;
padding:55px 20px;

.section-title{

font-size:3rem;
font-weight:500;
text-align:center;
margin-bottom:26px;
color:var(--sage-dark);

}

background:var(--white-glass);

border-radius:26px;
text-align:center;

}

#timer{

font-weight:600;
color:var(--sage-dark);

letter-spacing:1px;

background:var(--white-glass);
padding:42px;
border-radius:26px;
line-height:2;
font-size:1.02rem;
text-align:center;
backdrop-filter:blur(14px);

}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:18px;
}

@media(max-width:950px){
.grid{
grid-template-columns:1fr;
gap:16px;
}
}

.card{
background:var(--white-glass);
padding:24px;
border-radius:26px;
text-align:center;
backdrop-filter:blur(14px);
box-shadow:0 10px 35px rgba(0,0,0,0.08);
border:1px solid rgba(255,255,255,0.45);
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
}

.card h3{
font-family:'Cormorant Garamond',serif;
font-size:2rem;
font-weight:500;
margin-bottom:12px;
color:var(--sage-dark);
}

.card p{
line-height:1.75;
font-size:.97rem;
}

/* IMAGES */

.icon-image{
width:100px;
height:100px;
object-fit:cover;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.12);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:20px;
margin-top:18px;
}

.btn{

margin-top:18px;
padding:12px 24px;
background:var(--sage);
color:white;
text-decoration:none;
border-radius:999px;
font-size:.9rem;
font-weight:500;
letter-spacing:.8px;

}

.btn:hover{

iframe{
width:100%;
height:220px;
border:none;
border-radius:20px;
margin-top:16px;

}

/* FAQ */

.faq-item{
margin-bottom:20px;
text-align:left;

.faq-item h4{

.bank-container{

function toggleMusic() {
const music = document.getElementById('backgroundMusic');
const btn = document.getElementById('musicToggle');

if(music.paused) {
music.play();
btn.textContent = '♫';
} else {
music.pause();
btn.textContent = '🔇';
}
}

function updateCountdown() {
const eventDate = new Date('2026-09-26T18:30:00').getTime();
const now = new Date().getTime();
const difference = eventDate - now;

const days = Math.floor(difference / (1000 * 60 * 60 * 24));
const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((difference % (1000 * 60)) / 1000);

document.getElementById('timer').innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

window.addEventListener('load', function() {
const savedLang = localStorage.getItem('lang') || 'es';
setLang(savedLang);
updateCountdown();
setInterval(updateCountdown, 1000);
});
