<!DOCTYPE html>
<html lang="es">
<head>

<title>Hyo Hwan & Patricia</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --cream:#f6f1e7;
  --green:#8ba391;
  --green-dark:#3f4a41;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Montserrat,sans-serif;
  background:var(--cream);
  color:var(--green-dark);
}

/* MODAL */
#langModal{
  position:fixed;
  inset:0;
  background:rgba(246,241,231,0.98);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#langModal h2{
  font-family:"Cormorant Garamond";
  font-size:2.6rem;
  margin-bottom:20px;
}

#langModal button{
  margin:6px;
  padding:12px 20px;
  border-radius:999px;
  border:none;
  background:var(--green);
  color:white;
}

/* HERO */
.hero{
  height:90vh;
  background:
    linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(246,241,231,0.1)),
    url("foto1.jpg") center/cover no-repeat;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  text-align:center;
  padding:40px;
  color:white;
}

.hero h1{
  font-size:3.5rem;
  font-family:"Cormorant Garamond";
}

.hero-date{
  font-size:2.2rem;
  margin-top:10px;
}

/* COUNTDOWN */
#timer{
  background:rgba(255,255,255,0.85);
  color:var(--green-dark);
  padding:10px 20px;
  border-radius:999px;
  margin-bottom:20px;
}

/* SECTIONS */
section{
  max-width:1000px;
  margin:auto;
  padding:70px 20px;
}

.title{
  text-align:center;
  font-size:2.4rem;
  font-family:"Cormorant Garamond";
  margin-bottom:25px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
}

/* IMAGES */
.card img{
  width:100%;
  border-radius:12px;
  margin-top:10px;
}

/* MAP */
iframe{
  width:100%;
  height:180px;
  border:none;
  border-radius:12px;
  margin-top:10px;
}

/* BTN */
.btn{
  display:inline-block;
  padding:12px 18px;
  background:var(--green);
  color:white;
  border-radius:999px;
  margin-top:10px;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
  color:var(--green-dark);
}

</style>
</head>

<div id="langModal">
  <h2>Select language</h2>
  <button onclick="setLang('es')">Español</button>
  <button onclick="setLang('en')">English</button>
  <button onclick="setLang('fr')">Français</button>
  <button onclick="setLang('it')">Italiano</button>
  <button onclick="setLang('kr')">한국어</button>
</div>

<!-- HERO -->
<div class="hero">

  <div id="timer"></div>

  <h1 id="weddingTitle">¡¡¡NOS CASAMOS!!!</h1>

  <p>Hyo Hwan & Patricia</p>

  <div class="hero-date" id="weddingDate">
    26 · SEPTIEMBRE · 2026
  </div>

  <p id="intro"></p>

</div>

<!-- COUNTDOWN -->
<section>
  <div class="card">
    <h2 id="countTitle">Cuenta atrás</h2>
    <div id="timerBig" style="font-size:1.4rem;"></div>
  </div>
</section>

<!-- HISTORIA -->
<section>
<h2 class="title" id="t_story"></h2>
<p class="card" id="story"></p>
</section>
