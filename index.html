<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patricia & Hyo Hwan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Montserrat',sans-serif;
  color:white;
  overflow-x:hidden;
  background:
  linear-gradient(rgba(0,0,0,0.70),rgba(0,0,0,0.70)),
  url('foto2.jpg') center center/cover fixed no-repeat;
}

body.no-scroll{
  overflow:hidden;
}

/* SELECTOR */
#language-selector{
  position:fixed;
  inset:0;
  background:#111;
  z-index:9999;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  transition:opacity .5s ease, visibility .5s ease;
}

#language-selector.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#language-selector h2{
  font-family:'Cormorant Garamond',serif;
  font-size:3rem;
  margin-bottom:40px;
  font-weight:400;
}

.lang-buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
}

.lang-btn{
  padding:14px 28px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.08);
  color:white;
  cursor:pointer;
  font-size:1rem;
  transition:.3s;
}

.lang-btn:hover{
  background:rgba(255,255,255,0.2);
  transform:translateY(-3px);
}

/* HERO */
.hero{
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  text-align:center;

  position:relative;

  padding-top:220px;
  padding-left:20px;
  padding-right:20px;

  background:
  linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.45)),
  url('foto1.jpg') center center/cover no-repeat;
}

.hero-content{
  width:100%;
}

#timer{
  font-size:1.3rem;
  margin-bottom:130px;
  letter-spacing:3px;

  background:rgba(0,0,0,0.25);

  padding:12px 26px;
  border-radius:999px;

  backdrop-filter:blur(10px);

  display:inline-block;
}

.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(4rem,10vw,7rem);
  font-weight:400;
  letter-spacing:4px;
}

.hero p{
  margin-top:18px;
  letter-spacing:5px;
  text-transform:uppercase;
}

section{
  max-width:1100px;
  margin:auto;
  padding:100px 25px;
}

.section-title{
  font-family:'Cormorant Garamond',serif;
  font-size:3rem;
  text-align:center;
  margin-bottom:25px;
  font-weight:400;
}

.intro{
  text-align:center;
  font-size:1.1rem;
  line-height:1.9;
  color:#f1f1f1;
  max-width:760px;
  margin:auto;
}

.details-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
  margin-top:70px;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:28px;
  padding:45px 35px;
  text-align:center;
}

.card h3{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;
  margin-bottom:15px;
  font-weight:500;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:16px 38px;
  border-radius:999px;
  background:white;
  color:black;
  text-decoration:none;
  letter-spacing:2px;
  transition:.3s;
}

.btn:hover{
  background:#d9c2a0;
  transform:translateY(-3px);
}

footer{
  text-align:center;
  padding:40px 20px 60px;
  color:#ccc;
  font-size:.9rem;
}

@media(max-width:768px){

.hero{
  padding-top:180px;
}

.hero h1{
  font-size:4rem;
}

#timer{
  margin-bottom:100px;
  font-size:1rem;
}

section{
  padding:80px 20px;
}

}

</style>
</head>

<body class="no-scroll">

<!-- SELECTOR -->
<div id="language-selector">

<h2>Choose Language</h2>

<div class="lang-buttons">

<button onclick="setLanguage('es')" class="lang-btn">
Español
</button>

<button onclick="setLanguage('en')" class="lang-btn">
English
</button>

<button onclick="setLanguage('fr')" class="lang-btn">
Français
</button>

<button onclick="setLanguage('it')" class="lang-btn">
Italiano
</button>

<button onclick="setLanguage('kr')" class="lang-btn">
한국어
</button>

</div>

</div>

<!-- HERO -->
<section class="hero">

<div class="hero-content">

<div id="timer"></div>

<p id="heroSubtitle">WE ARE GETTING MARRIED</p>

<h1>Patricia & Hyo Hwan</h1>

<p id="dateText">26 · September · 2026</p>

</div>

</section>

<!-- STORY -->
<section>

<h2 class="section-title" id="storyTitle"></h2>

<p class="intro" id="storyText"></p>

</section>

<!-- DETAILS -->
<section>

<h2 class="section-title" id="detailsTitle"></h2>

<div class="details-grid">

<div class="card">

<h3 id="ceremonyTitle"></h3>

<p>17:30h</p>

<p id="ceremonyPlace"></p>

</div>

<div class="card">

<h3 id="partyTitle"></h3>

<p id="partyText1"></p>

<p id="partyText2"></p>

</div>

<div class="card">

<h3 id="dressTitle"></h3>

<p id="dressText1"></p>

<p id="dressText2"></p>

</div>

</div>

<div class="details-grid">

<div class="card">

<h3 id="stayTitle"></h3>

<p id="stayText"></p>

<p style="margin-top:20px;font-weight:600;">
Hotel Amistad Murcia
</p>

<a
href="Descuentos en hotel para vosotros.pdf"
target="_blank"
class="btn"
id="hotel1Btn">
</a>

<p style="margin-top:30px;font-weight:600;">
Cetina Murcia
</p>

<a
href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf"
target="_blank"
class="btn"
id="hotel2Btn">
</a>

</div>

<div class="card">

<h3 id="musicTitle"></h3>

<p id="musicText"></p>

<a
href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe"
target="_blank"
class="btn"
id="musicBtn">
</a>

</div>

</div>

</section>

<!-- RSVP -->
<section>

<h2 class="section-title" id="confirmTitle"></h2>

<p class="intro" id="confirmText"></p>

<div style="text-align:center;">

<a
href="https://forms.gle/VbBLwKAwJP2qk6uT9"
target="_blank"
class="btn"
id="confirmBtn">
</a>

</div>

</section>

<!-- REGALOS -->
<section>

<h2 class="section-title" id="giftTitle"></h2>

<div class="card" style="max-width:700px;margin:auto;">

<p
id="giftQuote"
style="
font-style:italic;
margin-bottom:25px;
line-height:1.8;
opacity:.9;
"
></p>

<p
id="giftText"
style="margin-bottom:30px;"
></p>

<!-- IBAN -->
<div
style="
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:18px;
margin-bottom:20px;
"
>

<p style="margin-bottom:10px;font-weight:600;">
IBAN
</p>

<div
id="ibanText"
style="
font-size:1.05rem;
letter-spacing:2px;
word-break:break-word;
"
>
ESXX XXXX XXXX XXXX XXXX XXXX
</div>

</div>

<!-- SWIFT -->
<div
style="
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:18px;
margin-bottom:25px;
"
>

<p style="margin-bottom:10px;font-weight:600;">
SWIFT / BIC
</p>

<div
id="swiftText"
style="
font-size:1.05rem;
letter-spacing:2px;
word-break:break-word;
"
>
XXXXESXX
</div>

</div>

<button
onclick="copyBankData()"
class="btn"
id="copyBtn"
style="border:none;cursor:pointer;"
>
COPIAR DATOS
</button>

<p
id="copyMessage"
style="
margin-top:20px;
opacity:0;
transition:.3s;
font-size:.95rem;
"
>
✓ Copiado
</p>

</div>

</section>

<footer id="footerText"></footer>

<!-- AUDIO -->
<audio id="bg-music" loop playsinline>
  <source src="Lavieenrose.mp3" type="audio/mpeg">
</audio>

<script>

/* BLOQUEAR SCROLL */
document.body.classList.add("no-scroll");

/* AUDIO */
const audio = document.getElementById("bg-music");
audio.volume = 0.25;

/* TRADUCCIONES */
const translations = {

es:{
heroSubtitle:"NOS CASAMOS",
dateText:"26 · Septiembre · 2026",
storyTitle:"Nuestra Historia",
storyText:"Dos caminos completamente distintos terminaron cruzándose en el momento perfecto. Entre viajes, conversaciones infinitas y atardeceres junto al mar, Patricia y Hyo Hwan construyeron una historia llena de aventuras, calma y muchísimo amor.",
detailsTitle:"Detalles",
ceremonyTitle:"Ceremonia",
ceremonyPlace:"Finca Siempre Verde · Murcia",
partyTitle:"Celebración",
partyText1:"Cena & Fiesta",
partyText2:"Hasta el amanecer ✨",
dressTitle:"Dress Code",
dressText1:"Libre",
dressText2:"Lo importante es celebrar juntos ✨",
stayTitle:"Alojamiento",
stayText:"Hemos preparado opciones para vuestra estancia.",
hotel1Btn:"VER PDF HOTEL",
hotel2Btn:"VER PDF HOTEL",
musicTitle:"Música",
musicText:"Añade canciones a nuestra playlist ✨",
musicBtn:"ABRIR PLAYLIST",
confirmTitle:"Confirmación",
confirmText:"Nos haría muchísima ilusión compartir este día contigo.",
confirmBtn:"CONFIRMAR ASISTENCIA",
giftTitle:"Regalos",
giftQuote:"El mejor regalo es compartir este día con vosotros, pero si queréis ayudarnos a comenzar esta nueva aventura, podéis hacerlo aquí ✨",
giftText:"Vuestra presencia es lo más importante para nosotros.",
copyBtn:"COPIAR DATOS",
footerText:"Hecho con amor · Patricia & Hyo Hwan"
},

en:{
heroSubtitle:"WE ARE GETTING MARRIED",
dateText:"26 · September · 2026",
storyTitle:"Our Story",
storyText:"Two completely different paths crossed at the perfect moment. Between travels, endless conversations and sunsets by the sea, Patricia and Hyo Hwan built a beautiful story full of love.",
detailsTitle:"Details",
ceremonyTitle:"Ceremony",
ceremonyPlace:"Siempre Verde Estate · Murcia",
partyTitle:"Celebration",
partyText1:"Dinner & Party",
partyText2:"Until sunrise ✨",
dressTitle:"Dress Code",
dressText1:"Free",
dressText2:"The important thing is celebrating together ✨",
stayTitle:"Accommodation",
stayText:"We prepared accommodation options for your stay.",
hotel1Btn:"OPEN HOTEL PDF",
hotel2Btn:"OPEN HOTEL PDF",
musicTitle:"Music",
musicText:"Add songs to our playlist ✨",
musicBtn:"OPEN PLAYLIST",
confirmTitle:"RSVP",
confirmText:"We would love to celebrate this day with you.",
confirmBtn:"CONFIRM ATTENDANCE",
giftTitle:"Gifts",
giftQuote:"The best gift is sharing this special day with you, but if you would like to help us start this new adventure, you can do it here ✨",
giftText:"Your presence means the world to us.",
copyBtn:"COPY DETAILS",
footerText:"Made with love · Patricia & Hyo Hwan"
}

};

/* CAMBIAR IDIOMA */
function setLanguage(lang){

  document
    .getElementById("language-selector")
    .classList.add("hidden");

  document.body.classList.remove("no-scroll");

  Object.keys(translations[lang]).forEach(id=>{

    const el = document.getElementById(id);

    if(el){
      el.innerHTML = translations[lang][id];
    }

  });

  /* MÚSICA */
  audio.muted = false;

  const playPromise = audio.play();

  if(playPromise !== undefined){

    playPromise
      .then(() => {
        console.log("audio iniciado");
      })
      .catch((error) => {
        console.log(error);
      });

  }

}

/* COPIAR DATOS */
function copyBankData(){

const iban =
document.getElementById("ibanText").innerText;

const swift =
document.getElementById("swiftText").innerText;

const text =
`IBAN: ${iban}
SWIFT/BIC: ${swift}`;

navigator.clipboard.writeText(text);

const msg =
document.getElementById("copyMessage");

msg.style.opacity = "1";

setTimeout(()=>{

msg.style.opacity = "0";

},2000);

}

/* COUNTDOWN */
const weddingDate =
new Date("September 26, 2026 17:30:00").getTime();

setInterval(()=>{

  const now = new Date().getTime();

  const distance = weddingDate - now;

  const days =
  Math.floor(distance/(1000*60*60*24));

  const hours =
  Math.floor((distance%(1000*60*60*24))/(1000*60*60));

  const minutes =
  Math.floor((distance%(1000*60*60))/(1000*60));

  document.getElementById("timer").innerHTML =
  `${days} days · ${hours}h · ${minutes}m`;

},1000);

</script>

</body>
</html>
