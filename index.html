<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boda</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body, html {
  height: 100%;
  overflow-x: hidden;
  background: #000;
}

/* LANG SELECTOR */
#langSelector {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 9999;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 10px;
  color: white;
}

#langSelector button {
  background: transparent;
  border: 1px solid white;
  color: white;
  padding: 5px 8px;
  margin: 0 3px;
  cursor: pointer;
}

/* HERO */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  filter: brightness(0.75);
}

/* OVERLAY TEXT */
.hero-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
  z-index: 2;
  padding: 20px;
  max-width: 90%;
}

.hero-text h1 {
  font-size: 3em;
  margin-bottom: 10px;
}

.hero-text p {
  font-size: 1.2em;
}

/* COUNTDOWN */
#countdown {
  margin-top: 15px;
  font-size: 1.5em;
}

/* MUSIC BUTTON */
#musicBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  padding: 10px 15px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: white;
}

/* SECTIONS */
.section {
  padding: 60px 20px;
  text-align: center;
  background: #111;
  color: white;
}

.section img {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 20px;
  margin-top: 20px;
}
</style>
</head>

<body>

<!-- LANGUAGE -->
<div id="langSelector">
  <button onclick="setLang('es')">ES</button>
  <button onclick="setLang('en')">EN</button>
</div>

<!-- MUSIC -->
<button id="musicBtn">▶ Música</button>
<audio id="audio" loop>
  <source src="La vie en rose - Louis Armstrong.mp3" type="audio/mpeg">
</audio>

<!-- HERO -->
<div class="hero">
  <img src="foto1.jpg" alt="boda">
  <div class="hero-text">
    <h1 id="title">Nuestra Boda</h1>
    <p id="subtitle">24 de Mayo 2026</p>
    
    <div id="countdown"></div>
  </div>
</div>

<!-- SECTION -->
<div class="section">
  <h2 id="storyTitle">Nuestra historia</h2>
  <p id="storyText">
    Desde el primer día supimos que esto era especial.
  </p>
  <img src="foto2.jpg" alt="historia">
</div>

<!-- SCRIPT -->
