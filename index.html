font-weight:500;
margin-bottom:35px;
color:var(--sage-dark);
letter-spacing:1px;
}

.language-buttons{
display:flex;
gap:14px;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}

.language-buttons button{
padding:13px 24px;
border:none;
border-radius:999px;
background:rgba(156,175,155,0.92);
color:white;
font-size:.95rem;
font-weight:500;
cursor:pointer;
transition:.35s;
backdrop-filter:blur(10px);

}

.language-buttons button:hover{
background:var(--sage-dark);
transform:translateY(-2px);
}

.hero{
position:relative;
min-height:100vh;
width:100vw;

background:

url("foto1.jpg") center 100% / cover no-repeat;

display:flex;
flex-direction:column;
justify-content:flex-end;
align-items:center;
text-align:center;

padding:60px 20px 55px;
color:white;
overflow:hidden;
}

/* MARCO ELEGANTE */

.hero::before{
content:"";
position:absolute;
inset:18px;
border:1.5px solid rgba(255,255,255,0.55);
border-radius:34px;
pointer-events:none;
box-shadow:
0 0 0 1px rgba(255,255,255,0.15),
0 25px 60px rgba(0,0,0,0.22);
}

/* BRILLO SUAVE */

.hero::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
180deg,
rgba(255,255,255,0.04) 0%,
rgba(255,255,255,0) 30%,
rgba(0,0,0,0.12) 100%
);
pointer-events:none;
}

.hero h1,
.hero .names,
.hero .date{
position:relative;
z-index:2;
}

.hero h1{
font-family:'Montserrat',sans-serif;
font-size:clamp(1.2rem, 3.5vw, 2.5rem);
font-weight:400;
line-height:1;
letter-spacing:2px;
text-shadow:0 4px 18px rgba(0,0,0,0.25);
margin-bottom:15px;
}

.hero .names{
font-size:clamp(0.9rem, 2.5vw, 1.2rem);
letter-spacing:2px;
margin-top:14px;
}

.hero .date{
font-size:clamp(1.2rem, 3.5vw, 2.5rem);
font-weight:400;
letter-spacing:2px;
text-shadow:0 4px 14px rgba(0,0,0,0.25);
margin-top:18px;
}

right:18px;
bottom:18px;

height:60px;

border-radius:50%;

color:white;

z-index:999;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

max-width:1180px;
margin:auto;
padding:90px 20px;

.section-title{
font-family:'Cormorant Garamond',serif;
font-size:3rem;
text-align:center;
margin-bottom:35px;
color:var(--green-dark);
}

max-width:760px;
margin:auto;
background:var(--white-glass);
padding:28px;
border-radius:26px;
text-align:center;

border-radius:26px;

}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:18px;
}

@media(max-width:950px){
.grid{
grid-template-columns:1fr;
gap:16px;
}
}

.card{
background:var(--white-glass);
padding:24px;
border-radius:26px;
text-align:center;
backdrop-filter:blur(14px);
box-shadow:0 10px 35px rgba(0,0,0,0.08);

transition:.3s;

.card:hover{
transform:translateY(-4px);
}

.card h3{

font-size:2rem;
font-weight:500;
margin-bottom:12px;
color:var(--sage-dark);
}

.card p{
line-height:1.75;
font-size:.97rem;
}

.icon-image{
width:100px;
height:100px;
object-fit:cover;
border-radius:24px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.12);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:20px;
margin-top:18px;

text-decoration:none;

font-weight:500;

.bank-container{

function toggleMusic() {
const music = document.getElementById('backgroundMusic');
const btn = document.getElementById('musicToggle');

if(music.paused) {
music.play();
btn.textContent = '♫';
} else {
music.pause();
btn.textContent = '🔇';
}
}

function updateCountdown() {
const eventDate = new Date('2026-09-26T18:30:00').getTime();
const now = new Date().getTime();
const difference = eventDate - now;

const days = Math.floor(difference / (1000 * 60 * 60 * 24));
const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((difference % (1000 * 60)) / 1000);

document.getElementById('timer').innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

window.addEventListener('load', function() {
const savedLang = localStorage.getItem('lang');
if (savedLang) {
setLang(savedLang);
} else {
// Si no hay idioma guardado, dejar el modal visible
}
updateCountdown();
setInterval(updateCountdown, 1000);
});
