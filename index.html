<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patricia & Hyo Hwan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --cream:#f6f1e7;
  --soft-cream:#fffaf3;
  --eucalyptus:#8ba391;
  --eucalyptus-dark:#6f8776;
  --text:#5e665f;
  --white:#ffffff;
}

body{
  font-family:'Montserrat',sans-serif;
  color:var(--text);
  overflow-x:hidden;
  background:
  linear-gradient(rgba(246,241,231,0.72),rgba(246,241,231,0.82)),
  url('foto2.jpg') center center/cover fixed no-repeat;
}

body.no-scroll{
  overflow:hidden;
}

#language-selector{
  position:fixed;
  inset:0;
  background:linear-gradient(rgba(246,241,231,0.97),rgba(246,241,231,0.97)),url('foto1.jpg') center center/cover;
  z-index:9999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity .5s ease, visibility .5s ease;
}

#language-selector.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#language-selector h2{
  font-family:'Cormorant Garamond',serif;
  font-size:3.2rem;
  margin-bottom:40px;
  font-weight:500;
  color:var(--eucalyptus-dark);
}

.lang-buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.lang-btn{
  padding:14px 30px;
  border-radius:999px;
  border:none;
  background:rgba(139,163,145,0.18);
  color:var(--eucalyptus-dark);
  cursor:pointer;
  font-size:1rem;
  transition:.3s;
  backdrop-filter:blur(10px);
  font-weight:500;
}

.lang-btn:hover{
  background:var(--eucalyptus);
  color:white;
  transform:translateY(-3px);
}

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  text-align:center;
  position:relative;
  padding-top:230px;
  padding-left:20px;
  padding-right:20px;
  background:
  linear-gradient(rgba(246,241,231,0.45),rgba(246,241,231,0.55)),
  url('foto1.jpg') center center/cover no-repeat;
}

.hero::after{
  content:'';
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:180px;
  background:linear-gradient(to top,var(--cream),transparent);
}

.hero-content{
  width:100%;
  position:relative;
  z-index:2;
}

#timer{
  font-size:1.2rem;
  margin-bottom:140px;
  letter-spacing:2px;
  background:rgba(255,255,255,0.55);
  padding:14px 30px;
  border-radius:999px;
  backdrop-filter:blur(10px);
  display:inline-block;
  color:var(--eucalyptus-dark);
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(4rem,10vw,7rem);
  font-weight:500;
  letter-spacing:3px;
  color:#ffffff;
  text-shadow:0 4px 20px rgba(0,0,0,0.18);
}

.hero p{
  margin-top:18px;
  letter-spacing:5px;
  text-transform:uppercase;
  color:#ffffff;
  text-shadow:0 2px 10px rgba(0,0,0,0.18);
}

section{
  max-width:1150px;
  margin:auto;
  padding:110px 25px;
}

.section-title{
  font-family:'Cormorant Garamond',serif;
  font-size:3.2rem;
  text-align:center;
  margin-bottom:30px;
  font-weight:500;
  color:var(--eucalyptus-dark);
}

.intro{
  text-align:center;
  font-size:1.08rem;
  line-height:2;
  color:#6a726b;
  max-width:800px;
  margin:auto;
}

.details-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
  margin-top:70px;
}

.card{
  background:rgba(255,255,255,0.52);
  backdrop-filter:blur(12px);
  border-radius:32px;
  padding:45px 35px;
  text-align:center;
  box-shadow:0 12px 35px rgba(110,126,116,0.12);
  border:1px solid rgba(255,255,255,0.5);
}

.card h3{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;
  margin-bottom:18px;
  font-weight:500;
  color:var(--eucalyptus-dark);
}

.card p{
  line-height:1.8;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:15px 34px;
  border-radius:999px;
  background:var(--eucalyptus);
  color:white;
  text-decoration:none;
  letter-spacing:2px;
  transition:.3s;
  border:none;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(139,163,145,0.28);
}

.btn:hover{
  background:var(--eucalyptus-dark);
  transform:translateY(-3px);
}

footer{
  text-align:center;
  padding:50px 20px 70px;
  color:#7f867f;
  font-size:.95rem;
}

@media(max-width:768px){

.hero{
  padding-top:180px;
}

.hero h1{
  font-size:4rem;
}

#timer{
  margin-bottom:110px;
  font-size:1rem;
}

section{
  padding:80px 20px;
}

#language-selector h2{
  font-size:2.4rem;
}

}

</style>
</head>

<body class="no-scroll">

<div id="language-selector">

<h2>Choose Language</h2>

<div class="lang-buttons">
<button onclick="setLanguage('es')" class="lang-btn">Español</button>
<button onclick="setLanguage('en')" class="lang-btn">English</button>
<button onclick="setLanguage('fr')" class="lang-btn">Français</button>
<button onclick="setLanguage('it')" class="lang-btn">Italiano</button>
<button onclick="setLanguage('kr')" class="lang-btn">한국어</button>
</div>

</div>

<section class="hero">

<div class="hero-content">

<div id="timer"></div>

<p id="heroSubtitle">WE ARE GETTING MARRIED</p>

<h1>Hyo Hwan & Patricia</h1>

<p id="dateText">26 · September · 2026</p>

</div>

</section>

<section>

<h2 class="section-title" id="storyTitle"></h2>

<p class="intro" id="storyText"></p>

</section>

<section>

<h2 class="section-title" id="detailsTitle"></h2>

<div class="details-grid">

<div class="card">
<h3 id="ceremonyTitle"></h3>
<p>17:30h</p>
<p id="ceremonyPlace"></p>
</div>

<div class="card">
<h3 id="partyTitle"></h3>
<p id="partyText1"></p>
<p id="partyText2"></p>
</div>

<div class="card">
<h3 id="dressTitle"></h3>
<p id="dressText1"></p>
<p id="dressText2"></p>
</div>

</div>

<div class="details-grid">

<div class="card">

<h3 id="stayTitle"></h3>

<p id="stayText"></p>

<p style="margin-top:20px;font-weight:600;">
Hotel Amistad Murcia
</p>

<a
href="Descuentos en hotel para vosotros.pdf"
target="_blank"
class="btn"
id="hotel1Btn">
</a>

<p style="margin-top:30px;font-weight:600;">
Cetina Murcia
</p>

<a
href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf"
target="_blank"
class="btn"
id="hotel2Btn">
</a>

</div>

<div class="card">

<h3 id="musicTitle"></h3>

<p id="musicText"></p>

<a
href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe"
target="_blank"
class="btn"
id="musicBtn">
</a>

</div>

</div>

</section>

<section>

<h2 class="section-title" id="confirmTitle"></h2>

<p class="intro" id="confirmText"></p>

<div style="text-align:center;">

<a
href="https://forms.gle/VbBLwKAwJP2qk6uT9"
target="_blank"
class="btn"
id="confirmBtn">
</a>

</div>

</section>

<section>

<h2 class="section-title" id="giftTitle"></h2>

<div class="card" style="max-width:700px;margin:auto;">

<p
id="giftQuote"
style="font-style:italic;margin-bottom:25px;line-height:1.9;opacity:.9;"
></p>

<p id="giftText" style="margin-bottom:30px;"></p>

<div style="background:rgba(255,255,255,0.45);padding:20px;border-radius:20px;margin-bottom:22px;">

<p style="margin-bottom:10px;font-weight:600;color:var(--eucalyptus-dark);">
IBAN
</p>

<div id="ibanText" style="font-size:1.05rem;letter-spacing:2px;word-break:break-word;margin-bottom:20px;">
ESXX XXXX XXXX XXXX XXXX XXXX
</div>

<button onclick="copyIBAN()" class="btn" id="copyIbanBtn" style="margin-top:0;"></button>

</div>

<div style="background:rgba(255,255,255,0.45);padding:20px;border-radius:20px;margin-bottom:25px;">

<p style="margin-bottom:10px;font-weight:600;color:var(--eucalyptus-dark);">
SWIFT / BIC
</p>

<div id="swiftText" style="font-size:1.05rem;letter-spacing:2px;word-break:break-word;margin-bottom:20px;">
XXXXESXX
</div>

<button onclick="copySWIFT()" class="btn" id="copySwiftBtn" style="margin-top:0;"></button>

</div>

<p id="copyMessage" style="margin-top:20px;opacity:0;transition:.3s;font-size:.95rem;color:var(--eucalyptus-dark);">
✓ Copied
</p>

</div>

</section>

<footer id="footerText"></footer>

<audio id="bg-music" loop playsinline>
<source src="Lavieenrose.mp3" type="audio/mpeg">
</audio>

<script>

document.body.classList.add("no-scroll");

const audio = document.getElementById("bg-music");
audio.volume = 0.25;

const translations = {

es:{
heroSubtitle:"NOS CASAMOS",
dateText:"26 · Septiembre · 2026",
storyTitle:"Nuestra Historia",
storyText:"Dos caminos completamente distintos terminaron cruzándose en el momento perfecto. Entre viajes, conversaciones infinitas y atardeceres junto al mar, Patricia y Hyo Hwan construyeron una historia llena de aventuras, calma y muchísimo amor.",
detailsTitle:"Detalles",
ceremonyTitle:"Ceremonia",
ceremonyPlace:"Finca Siempre Verde · Murcia",
partyTitle:"Celebración",
partyText1:"Cena & Fiesta",
partyText2:"Hasta el amanecer ✨",
dressTitle:"Dress Code",
dressText1:"Libre",
dressText2:"Lo importante es celebrar juntos ✨",
stayTitle:"Alojamiento",
stayText:"Hemos preparado opciones para vuestra estancia.",
hotel1Btn:"VER HOTEL",
hotel2Btn:"VER HOTEL",
musicTitle:"Música",
musicText:"Añade canciones a nuestra playlist ✨",
musicBtn:"ABRIR PLAYLIST",
confirmTitle:"Confirmación",
confirmText:"Nos haría muchísima ilusión compartir este día contigo.",
confirmBtn:"CONFIRMAR ASISTENCIA",
giftTitle:"Regalos",
giftQuote:"El mejor regalo es compartir este día con vosotros, pero si queréis ayudarnos a comenzar esta nueva aventura, podéis hacerlo aquí ✨",
giftText:"Vuestra presencia es lo más importante para nosotros.",
copyIbanBtn:"COPIAR IBAN",
copySwiftBtn:"COPIAR SWIFT",
footerText:"Hecho con amor · Patricia & Hyo Hwan"
},

en:{
heroSubtitle:"WE ARE GETTING MARRIED",
dateText:"26 · September · 2026",
storyTitle:"Our Story",
storyText:"Two completely different paths crossed at the perfect moment. Between travels, endless conversations and sunsets by the sea, Patricia and Hyo Hwan built a beautiful story full of love.",
detailsTitle:"Details",
ceremonyTitle:"Ceremony",
ceremonyPlace:"Siempre Verde Estate · Murcia",
partyTitle:"Celebration",
partyText1:"Dinner & Party",
partyText2:"Until sunrise ✨",
dressTitle:"Dress Code",
dressText1:"Free",
dressText2:"The important thing is celebrating together ✨",
stayTitle:"Accommodation",
stayText:"We prepared accommodation options for your stay.",
hotel1Btn:"OPEN HOTEL",
hotel2Btn:"OPEN HOTEL",
musicTitle:"Music",
musicText:"Add songs to our playlist ✨",
musicBtn:"OPEN PLAYLIST",
confirmTitle:"RSVP",
confirmText:"We would love to celebrate this day with you.",
confirmBtn:"CONFIRM ATTENDANCE",
giftTitle:"Gifts",
giftQuote:"The best gift is sharing this special day with you, but if you would like to help us start this new adventure, you can do it here ✨",
giftText:"Your presence means the world to us.",
copyIbanBtn:"COPY IBAN",
copySwiftBtn:"COPY SWIFT",
footerText:"Made with love · Patricia & Hyo Hwan"
}

};

function setLanguage(lang){

  document
  .getElementById("language-selector")
  .classList.add("hidden");

  document.body.classList.remove("no-scroll");

  Object.keys(translations[lang]).forEach(id=>{

    const el = document.getElementById(id);

    if(el){
      el.innerHTML = translations[lang][id];
    }

  });

  audio.muted = false;

  audio.play().catch(()=>{});

}

function copyIBAN(){

const iban =
document.getElementById("ibanText").innerText;

navigator.clipboard.writeText(iban);

showCopiedMessage();

}

function copySWIFT(){

const swift =
document.getElementById("swiftText").innerText;

navigator.clipboard.writeText(swift);

showCopiedMessage();

}

function showCopiedMessage(){

const msg =
document.getElementById("copyMessage");

msg.style.opacity = "1";

setTimeout(()=>{
msg.style.opacity = "0";
},2000);

}

const weddingDate =
new Date("September 26, 2026 17:30:00").getTime();

setInterval(()=>{

const now = new Date().getTime();

const distance = weddingDate - now;

const totalDays =
Math.floor(distance / (1000 * 60 * 60 * 24));

const months =
Math.floor(totalDays / 30);

const days =
totalDays % 30;

const hours =
Math.floor(
(distance % (1000*60*60*24)) /
(1000*60*60)
);

 document.getElementById("timer").innerHTML =
 `${months} months · ${days} days · ${hours}h`;

},1000);

</script>

</body>
</html>
