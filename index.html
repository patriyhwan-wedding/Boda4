<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patricia & Hyo Hwan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --cream:#f6f1e7;
  --eucalyptus:#8ba391;
  --dark:#5e665f;
  --white:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Montserrat,sans-serif;
  background:
    linear-gradient(rgba(246,241,231,0.72),rgba(246,241,231,0.75)),
    url("foto.jpg") center/cover fixed no-repeat;
  color:var(--dark);
}

/* LANGUAGE */
#lang{
  position:fixed;inset:0;
  background:var(--cream);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:9999;
}

#lang.hidden{display:none;}

.lang-btn{
  padding:12px 24px;
  margin:10px;
  border-radius:999px;
  border:none;
  background:rgba(139,163,145,0.2);
  cursor:pointer;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding-top:120px;
}

.hero h1{
  font-family:"Cormorant Garamond";
  font-size:4rem;
  color:#fff;
  text-shadow:0 5px 20px rgba(0,0,0,0.25);
}

.hero p{color:#fff;letter-spacing:3px;}

#timer{
  background:rgba(255,255,255,0.7);
  padding:10px 20px;
  border-radius:999px;
  margin-bottom:40px;
}

/* SECTIONS */
section{
  padding:80px 20px;
  max-width:1100px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:2.5rem;
  margin-bottom:20px;
  font-family:"Cormorant Garamond";
  color:var(--eucalyptus);
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.6);
  padding:25px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  text-align:center;
}

/* BUTTON */
.btn{
  display:inline-block;
  margin-top:15px;
  padding:12px 22px;
  background:var(--eucalyptus);
  color:#fff;
  border-radius:999px;
  text-decoration:none;
  border:none;
  cursor:pointer;
}

/* MAP */
iframe{
  width:100%;
  height:300px;
  border:none;
  border-radius:20px;
}

audio{display:none;}

</style>
</head>

<body>

<!-- LANGUAGE -->
<div id="lang">
<h2>Choose Language</h2>
<button class="lang-btn" onclick="setLang('es')">ES</button>
<button class="lang-btn" onclick="setLang('en')">EN</button>
<button class="lang-btn" onclick="setLang('fr')">FR</button>
<button class="lang-btn" onclick="setLang('it')">IT</button>
<button class="lang-btn" onclick="setLang('kr')">KR</button>
</div>

<!-- HERO -->
<div class="hero">
<div id="timer"></div>
<h1>Hyo Hwan & Patricia</h1>
<p>26 · Septiembre · 2026</p>
</div>

<!-- STORY -->
<section>
<h2 class="title" id="storyTitle"></h2>
<p id="storyText" style="text-align:center;max-width:700px;margin:auto;"></p>
</section>

<!-- DETAILS -->
<section>
<div class="cards">

<div class="card">
<h3 id="ceremonyTitle"></h3>
<p>17:30h</p>
<p>Finca Siempre Verde</p>
</div>

<div class="card">
<h3 id="partyTitle"></h3>
<p id="partyText1"></p>
<p id="partyText2"></p>
</div>

<div class="card">
<h3 id="dressTitle"></h3>
<p id="dressText1"></p>
<p id="dressText2"></p>
</div>

</div>
</section>

<!-- HOTELS -->
<section>
<div class="cards">

<div class="card">
<p>Hotel Amistad Murcia</p>
<a class="btn" target="_blank" href="Descuentos en hotel para vosotros.pdf">PDF</a>
</div>

<div class="card">
<p>Cetina Murcia</p>
<a class="btn" target="_blank" href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf">PDF</a>
</div>

</div>
</section>

<!-- MUSIC + RSVP -->
<section style="text-align:center;">
<a class="btn" target="_blank" href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe">Spotify</a>
<br><br>
<a class="btn" target="_blank" href="https://forms.gle/VbBLwKAwJP2qk6uT9">RSVP</a>
</section>

<!-- MAP -->
<section>
<h2 class="title">Cómo llegar</h2>

<iframe
src="https://www.google.com/maps?q=Finca%20Siempre%20Verde%20Murcia&output=embed">
</iframe>

<p style="text-align:center;margin-top:20px;">
Taxi · Uber · Cabify · Bolt
</p>
</section>

<!-- GIFTS -->
<section>
<div class="card">

<p>IBAN: ESXX XXXX XXXX XXXX</p>
<button class="btn" onclick="copy('iban')">Copiar IBAN</button>

<p style="margin-top:20px;">SWIFT: XXXXESXX</p>
<button class="btn" onclick="copy('swift')">Copiar SWIFT</button>

</div>
</section>

<!-- AUDIO -->
<audio id="music" loop>
<source src="Lavieenrose.mp3">
</audio>

<script>

const music=document.getElementById("music");

document.addEventListener("click",()=>music.play(),{once:true});

/* LANG */
function setLang(l){
document.getElementById("lang").classList.add("hidden");
music.play();
}

/* COUNTDOWN */
const d=new Date("2026-09-26T17:30:00").getTime();

setInterval(()=>{
let now=new Date().getTime();
let diff=d-now;

let m=Math.floor(diff/1000/60/60/24/30);
let days=Math.floor(diff/1000/60/60/24)%30;
let h=Math.floor(diff/1000/60/60)%24;

document.getElementById("timer").innerHTML=
`${m} meses · ${days} días · ${h}h`;

},1000);

/* COPY */
function copy(type){
if(type==="iban"){
navigator.clipboard.writeText("ESXX XXXX XXXX");
}
if(type==="swift"){
navigator.clipboard.writeText("XXXXESXX");
}
}

</script>

</body>
</html>
