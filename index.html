<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyo Hwan & Patricia</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --green:#8ba391;
  --green-dark:#2f3b31;
  --text:#2f3b31;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Montserrat,sans-serif;
  color:var(--text);
  background:
    linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)),
    url("foto2.jpg") center/cover fixed no-repeat;
}

/* MODAL */
#langModal{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.96);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#langModal h2{
  font-family:"Cormorant Garamond";
  font-size:2.8rem;
  margin-bottom:25px;
}

#langModal button{
  margin:6px;
  padding:12px 18px;
  border-radius:999px;
  border:none;
  background:var(--green);
  color:white;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  text-align:center;
  padding-top:120px;
  background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.35)),
    url("foto1.jpg") center/cover no-repeat;
}

.hero h1{
  font-family:"Cormorant Garamond";
  font-size:4.5rem;
  color:white;
  margin-top:15px;
}

.hero p{color:white;letter-spacing:3px;}

#timer{
  margin-top:20px;
  padding:10px 18px;
  background:rgba(255,255,255,0.75);
  border-radius:999px;
}

/* HERO TEXT */
.hero-bottom{
  margin-top:auto;
  padding-bottom:30px;
  color:white;
  opacity:.9;
  text-align:center;
}

/* SECTIONS */
section{
  max-width:1100px;
  margin:auto;
  padding:80px 20px;
}

.title{
  text-align:center;
  font-size:2.6rem;
  font-family:"Cormorant Garamond";
  color:var(--green-dark);
  margin-bottom:25px;
}

.intro{
  text-align:center;
  max-width:750px;
  margin:auto;
  line-height:1.9;
