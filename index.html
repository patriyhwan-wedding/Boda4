<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyo Hwan & Patricia</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

:root{
--cream:#f6f1e7;
--eucalyptus:#8ba391;
--eucalyptus-dark:#6f8776;
--text:#5e665f;
}

body{
font-family:'Montserrat',sans-serif;
color:var(--text);
overflow-x:hidden;
background:
linear-gradient(rgba(246,241,231,0.72),rgba(246,241,231,0.82)),
url('foto1.jpg') center/cover fixed;
}

body.no-scroll{overflow:hidden;}

/* LANGUAGE */
#language-selector{
position:fixed;inset:0;
background:var(--cream);
display:flex;flex-direction:column;
justify-content:center;align-items:center;
z-index:9999;
}
#language-selector.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.lang-btn{
margin:8px;padding:14px 28px;
border-radius:999px;
border:none;
background:rgba(139,163,145,0.2);
color:var(--eucalyptus-dark);
cursor:pointer;
}

/* HERO */
.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
text-align:center;
padding-top:220px;
background:
linear-gradient(rgba(214,226,217,0.3),rgba(246,241,231,0.4)),
url('foto1.jpg') center/cover;
}

#timer{
margin-bottom:120px;
background:rgba(255,255,255,0.6);
padding:12px 25px;
border-radius:999px;
display:inline-block;
}

.hero h1{
font-size:5rem;
color:white;
text-shadow:0 4px 20px rgba(0,0,0,0.2);
}

/* SECTIONS */
section{
max-width:1100px;
margin:auto;
padding:100px 20px;
}

.section-title{
text-align:center;
font-size:3rem;
margin-bottom:30px;
color:var(--eucalyptus-dark);
}

.card{
background:rgba(255,255,255,0.5);
padding:35px;
border-radius:25px;
text-align:center;
margin:15px;
}

/* BUTTON */
.btn{
background:var(--eucalyptus);
color:white;
padding:14px 30px;
border-radius:999px;
display:inline-block;
text-decoration:none;
margin-top:15px;
}

/* GIFTS */
.gift-box{
background:rgba(255,255,255,0.5);
padding:30px;
border-radius:25px;
text-align:center;
}

.copy-btn{
margin-top:10px;
}

footer{
text-align:center;
padding:40px;
}

</style>
</head>

<body class="no-scroll">

<!-- LANGUAGE -->
<div id="language-selector">
<h2>Choose Language</h2>
<button class="lang-btn" onclick="setLanguage('es')">Español</button>
<button class="lang-btn" onclick="setLanguage('en')">English</button>
<button class="lang-btn" onclick="setLanguage('fr')">Français</button>
<button class="lang-btn" onclick="setLanguage('it')">Italiano</button>
<button class="lang-btn" onclick="setLanguage('kr')">한국어</button>
</div>

<!-- HERO -->
<section class="hero">
<div>
<div id="timer"></div>
<h1>Hyo Hwan & Patricia</h1>
<p id="dateText">26 · Septiembre · 2026</p>
</div>
</section>

<!-- STORY -->
<section>
<h2 id="storyTitle" class="section-title"></h2>
<p id="storyText" style="text-align:center;max-width:800px;margin:auto;"></p>
</section>

<!-- DETAILS -->
<section>
<h2 id="detailsTitle" class="section-title"></h2>

<div class="card">
<h3 id="ceremonyTitle"></h3>
<p>17:30h</p>
<p id="ceremonyPlace"></p>
</div>

<div class="card">
<h3 id="partyTitle"></h3>
<p id="partyText1"></p>
<p id="partyText2"></p>
</div>

<div class="card">
<h3 id="dressTitle"></h3>
<p id="dressText1"></p>
<p id="dressText2"></p>
</div>
</section>

<!-- HOTELS -->
<section>
<div class="card">
<h3 id="stayTitle"></h3>
<p id="stayText"></p>

<a class="btn" target="_blank" href="Descuentos en hotel para vosotros.pdf">Hotel 1</a><br>
<a class="btn" target="_blank" href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf">Hotel 2</a>
</div>
</section>

<!-- TIMELINE -->
<section>
<h2 id="timelineTitle" class="section-title"></h2>

<div class="card"><p id="timeline1"></p></div>
<div class="card"><p id="timeline2"></p></div>
<div class="card"><p id="timeline3"></p></div>
<div class="card"><p id="timeline4"></p></div>
</section>

<!-- TRAVEL -->
<section>
<h2 id="travelTitle" class="section-title"></h2>

<div class="card">
<h3 id="locationTitle"></h3>
<p id="locationText"></p>
<a class="btn" target="_blank" href="https://maps.google.com" id="mapsBtn"></a>
</div>

<div class="card">
<h3 id="transportTitle"></h3>
<p id="transportText"></p>
</div>

<div class="card">
<h3 id="weatherTitle"></h3>
<p id="weatherText"></p>
</div>
</section>

<!-- MUSIC -->
<section>
<div class="card">
<h3 id="musicTitle"></h3>
<p id="musicText"></p>

<a class="btn" target="_blank"
href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe"
id="musicBtn"></a>
</div>
</section>

<!-- RSVP -->
<section>
<div class="card">
<h2 id="confirmTitle"></h2>
<p id="confirmText"></p>

<a class="btn" href="https://forms.gle/VbBLwKAwJP2qk6uT9" target="_blank" id="confirmBtn"></a>
</div>
</section>

<!-- GIFTS -->
<section>
<h2 id="giftTitle" class="section-title"></h2>

<div class="gift-box">

<p id="giftQuote"></p>
<p id="giftText"></p>

<p><b>IBAN:</b> ESXX XXXX XXXX XXXX</p>
<button class="btn copy-btn" onclick="copyIBAN()">Copiar IBAN</button>

<p style="margin-top:20px;"><b>SWIFT:</b> XXXXESXX</p>
<button class="btn copy-btn" onclick="copySWIFT()">Copiar SWIFT</button>

<p id="copyMessage" style="opacity:0;transition:.3s;margin-top:10px;">✓ Copiado</p>

</div>
</section>

<footer id="footerText"></footer>

<audio id="bg-music" loop>
<source src="Lavieenrose.mp3" type="audio/mpeg">
</audio>

<script>

/* MUSIC */
const audio=document.getElementById("bg-music");

function tryPlay(){
audio.volume=0.3;
audio.play().catch(()=>document.body.addEventListener("click",()=>audio.play(),{once:true}));
}

/* TRANSLATIONS */
const translations={

es:{storyTitle:"Nuestra Historia",storyText:"Historia bonita...",detailsTitle:"Detalles",ceremonyTitle:"Ceremonia",ceremonyPlace:"Finca Siempre Verde",partyTitle:"Celebración",partyText1:"Cena",partyText2:"Fiesta",dressTitle:"Dress Code",dressText1:"Libre",dressText2:"Elegante",stayTitle:"Alojamiento",stayText:"Opciones disponibles",musicTitle:"Música",musicText:"Playlist",musicBtn:"Abrir",confirmTitle:"Confirmación",confirmText:"Te esperamos",confirmBtn:"Confirmar",giftTitle:"Regalos",giftQuote:"Lo importante es venir",giftText:"Opcional",timelineTitle:"Horario",timeline1:"Ceremonia",timeline2:"Cóctel",timeline3:"Cena",timeline4:"Fiesta",travelTitle:"Cómo llegar",locationTitle:"Ubicación",locationText:"Murcia",mapsBtn:"Mapa",transportTitle:"Transporte",transportText:"Taxi recomendado",weatherTitle:"Clima",weatherText:"Cálido",footerText:"Hecho con amor"},

en:{storyTitle:"Our Story",storyText:"...",detailsTitle:"Details",ceremonyTitle:"Ceremony",ceremonyPlace:"Siempre Verde Estate",partyTitle:"Celebration",partyText1:"Dinner",partyText2:"Party",dressTitle:"Dress Code",dressText1:"Elegant",dressText2:"Free",stayTitle:"Accommodation",stayText:"Available",musicTitle:"Music",musicText:"Playlist",musicBtn:"Open",confirmTitle:"RSVP",confirmText:"We wait you",confirmBtn:"Confirm",giftTitle:"Gifts",giftQuote:"Your presence matters",giftText:"Optional",timelineTitle:"Schedule",timeline1:"Ceremony",timeline2:"Cocktail",timeline3:"Dinner",timeline4:"Party",travelTitle:"How to get there",locationTitle:"Location",locationText:"Murcia",mapsBtn:"Map",transportTitle:"Transport",transportText:"Taxi",weatherTitle:"Weather",weatherText:"Warm",footerText:"Made with love"},

fr:{storyTitle:"Notre Histoire",storyText:"...",detailsTitle:"Détails",ceremonyTitle:"Cérémonie",ceremonyPlace:"Murcie",partyTitle:"Fête",partyText1:"Dîner",partyText2:"Soirée",dressTitle:"Dress Code",dressText1:"Libre",dressText2:"Élégant",stayTitle:"Hébergement",stayText:"Disponible",musicTitle:"Musique",musicText:"Playlist",musicBtn:"Ouvrir",confirmTitle:"Confirmation",confirmText:"On vous attend",confirmBtn:"Confirmer",giftTitle:"Cadeaux",giftQuote:"Votre présence",giftText:"Optionnel",timelineTitle:"Programme",timeline1:"Cérémonie",timeline2:"Cocktail",timeline3:"Dîner",timeline4:"Fête",travelTitle:"Accès",locationTitle:"Lieu",locationText:"Murcie",mapsBtn:"Carte",transportTitle:"Transport",transportText:"Taxi",weatherTitle:"Météo",weatherText:"Doux",footerText:"Avec amour"},

it:{storyTitle:"La Nostra Storia",storyText:"...",detailsTitle:"Dettagli",ceremonyTitle:"Cerimonia",ceremonyPlace:"Murcia",partyTitle:"Festa",partyText1:"Cena",partyText2:"Party",dressTitle:"Dress Code",dressText1:"Libero",dressText2:"Elegante",stayTitle:"Alloggio",stayText:"Disponibile",musicTitle:"Musica",musicText:"Playlist",musicBtn:"Apri",confirmTitle:"Conferma",confirmText:"Ti aspettiamo",confirmBtn:"Conferma",giftTitle:"Regali",giftQuote:"La tua presenza",giftText:"Opzionale",timelineTitle:"Programma",timeline1:"Cerimonia",timeline2:"Aperitivo",timeline3:"Cena",timeline4:"Festa",travelTitle:"Come arrivare",locationTitle:"Posizione",locationText:"Murcia",mapsBtn:"Mappa",transportTitle:"Trasporto",transportText:"Taxi",weatherTitle:"Clima",weatherText:"Caldo",footerText:"Con amore"},

kr:{storyTitle:"우리 이야기",storyText:"...",detailsTitle:"정보",ceremonyTitle:"예식",ceremonyPlace:"Murcia",partyTitle:"파티",partyText1:"저녁",partyText2:"파티",dressTitle:"드레스",dressText1:"자유",dressText2:"우아함",stayTitle:"숙소",stayText:"가능",musicTitle:"음악",musicText:"플레이리스트",musicBtn:"열기",confirmTitle:"참석",confirmText:"기다립니다",confirmBtn:"확인",giftTitle:"선물",giftQuote:"당신의 존재",giftText:"선택",timelineTitle:"일정",timeline1:"예식",timeline2:"칵테일",timeline3:"저녁",timeline4:"파티",travelTitle:"오시는 길",locationTitle:"위치",locationText:"Murcia",mapsBtn:"지도",transportTitle:"교통",transportText:"택시",weatherTitle:"날씨",weatherText:"따뜻",footerText:"사랑으로"}

};

/* LANGUAGE */
function setLanguage(lang){

document.getElementById("language-selector").classList.add("hidden");
document.body.classList.remove("no-scroll");

Object.keys(translations[lang]).forEach(id=>{
const el=document.getElementById(id);
if(el) el.innerHTML=translations[lang][id];
});

tryPlay();
}

/* COPY */
function copyIBAN(){
navigator.clipboard.writeText("ESXX XXXX XXXX");
document.getElementById("copyMessage").style.opacity=1;
setTimeout(()=>document.getElementById("copyMessage").style.opacity=0,2000);
}

function copySWIFT(){
navigator.clipboard.writeText("XXXXESXX");
document.getElementById("copyMessage").style.opacity=1;
setTimeout(()=>document.getElementById("copyMessage").style.opacity=0,2000);
}

/* COUNTDOWN */
const weddingDate=new Date("2026-09-26T17:30:00").getTime();

setInterval(()=>{
const now=new Date().getTime();
const diff=weddingDate-now;

const months=Math.floor(diff/(1000*60*60*24*30));
const days=Math.floor((diff/(1000*60*60*24))%30);
const hours=Math.floor((diff/(1000*60*60))%24);

document.getElementById("timer").innerHTML=
`${months} meses · ${days} días · ${hours}h`;

},1000);

</script>

</body>
</html>
