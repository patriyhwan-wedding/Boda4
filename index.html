<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patricia & Hyo Hwan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =======================
   PALETA PREMIUM
======================= */

:root{
  --cream:#f6f1e7;
  --eucalipto:#8ba391;
  --eucalipto-dark:#6f8776;
  --text:#5e665f;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Montserrat',sans-serif;
  color:var(--text);
  overflow-x:hidden;

  /* 🖼️ FOTO PRINCIPAL */
  background:
    linear-gradient(rgba(246,241,231,0.55),rgba(246,241,231,0.65)),
    url("foto_boda.jpg") center/cover fixed no-repeat;
}

/* =======================
   LANGUAGE
======================= */

#lang{
  position:fixed;inset:0;
  background:var(--cream);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#lang.hidden{display:none;}

.lang-btn{
  padding:14px 26px;
  margin:10px;
  border-radius:999px;
  border:none;
  background:rgba(139,163,145,0.25);
  color:var(--eucalipto-dark);
  cursor:pointer;
}

/* =======================
   HERO (FORMATO PREMIUM)
======================= */

.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  text-align:center;
  padding-top:220px; /* 👈 evita caras tapadas */
}

.hero h1{
  font-family:'Cormorant Garamond';
  font-size:4.5rem;
  color:white;
  text-shadow:0 6px 25px rgba(0,0,0,0.25);
}

.hero p{
  color:white;
  letter-spacing:3px;
}

#timer{
  margin-bottom:110px;
  padding:12px 22px;
  border-radius:999px;
  background:rgba(255,255,255,0.7);
}

/* =======================
   SECCIONES
======================= */

section{
  max-width:1100px;
  margin:auto;
  padding:90px 20px;
}

.title{
  text-align:center;
  font-family:'Cormorant Garamond';
  font-size:2.8rem;
  color:var(--eucalipto-dark);
  margin-bottom:25px;
}

.intro{
  text-align:center;
  max-width:750px;
  margin:auto;
  line-height:1.9;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:22px;
  margin-top:40px;
}

.card{
  background:rgba(255,255,255,0.6);
  padding:30px;
  border-radius:25px;
  backdrop-filter:blur(10px);
  text-align:center;
}

/* BUTTON */
.btn{
  margin-top:15px;
  padding:12px 24px;
  border-radius:999px;
  background:var(--eucalipto);
  color:white;
  border:none;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

/* MAP */
iframe{
  width:100%;
  height:320px;
  border:none;
  border-radius:20px;
}

/* MUSIC HIDDEN */
audio{display:none;}

</style>
</head>

<body>

<!-- LANGUAGE -->
<div id="lang">
<h2>Choose Language</h2>
<button class="lang-btn" onclick="setLang('es')">ES</button>
<button class="lang-btn" onclick="setLang('en')">EN</button>
<button class="lang-btn" onclick="setLang('fr')">FR</button>
<button class="lang-btn" onclick="setLang('it')">IT</button>
<button class="lang-btn" onclick="setLang('kr')">KR</button>
</div>

<!-- HERO -->
<div class="hero">

<div id="timer"></div>

<h1>Hyo Hwan & Patricia</h1>

<p>26 · Septiembre · 2026</p>

</div>

<!-- STORY -->
<section>
<h2 class="title" id="storyTitle"></h2>
<p class="intro" id="storyText"></p>
</section>

<!-- DETAILS -->
<section>
<div class="grid">

<div class="card">
<h3 id="ceremonyTitle"></h3>
<p>17:30h</p>
<p>Finca Siempre Verde</p>
</div>

<div class="card">
<h3 id="partyTitle"></h3>
<p id="partyText1"></p>
<p id="partyText2"></p>
</div>

<div class="card">
<h3 id="dressTitle"></h3>
<p id="dressText1"></p>
<p id="dressText2"></p>
</div>

</div>
</section>

<!-- HOTELS -->
<section>
<div class="grid">

<div class="card">
<p>Hotel Amistad Murcia</p>
<a class="btn" target="_blank" href="Descuentos en hotel para vosotros.pdf">PDF</a>
</div>

<div class="card">
<p>Cetina Murcia</p>
<a class="btn" target="_blank" href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf">PDF</a>
</div>

</div>
</section>

<!-- MUSIC + RSVP -->
<section style="text-align:center;">
<a class="btn" target="_blank"
href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe">Spotify</a>

<br><br>

<a class="btn" target="_blank"
href="https://forms.gle/VbBLwKAwJP2qk6uT9">RSVP</a>
</section>

<!-- MAP -->
<section>
<h2 class="title">Cómo llegar</h2>

<iframe
src="https://www.google.com/maps?q=Finca%20Siempre%20Verde%20Murcia&output=embed">
</iframe>

</section>

<!-- GIFTS -->
<section>
<div class="card">

<p>IBAN: ESXX XXXX XXXX XXXX</p>
<button class="btn" onclick="copyIBAN()">Copiar IBAN</button>

<p style="margin-top:20px;">SWIFT: XXXXESXX</p>
<button class="btn" onclick="copySWIFT()">Copiar SWIFT</button>

</div>
</section>

<!-- AUDIO -->
<audio id="music" loop>
<source src="Lavieenrose.mp3">
</audio>

<script>

const music=document.getElementById("music");

/* autoplay real */
document.addEventListener("click",()=>music.play(),{once:true});

/* language */
function setLang(){
document.getElementById("lang").classList.add("hidden");
music.play();
}

/* countdown */
const date=new Date("2026-09-26T17:30:00").getTime();

setInterval(()=>{

let now=new Date().getTime();
let diff=date-now;

let m=Math.floor(diff/1000/60/60/24/30);
let d=Math.floor(diff/1000/60/60/24)%30;
let h=Math.floor(diff/1000/60/60)%24;

document.getElementById("timer").innerHTML=
`${m} meses · ${d} días · ${h}h`;

},1000);

/* copy */
function copyIBAN(){
navigator.clipboard.writeText("ESXX XXXX XXXX XXXX");
alert("IBAN copiado");
}

function copySWIFT(){
navigator.clipboard.writeText("XXXXESXX");
alert("SWIFT copiado");
}

</script>

</body>
</html>
