<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patricia & Hyo Hwan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== BASE ORIGINAL (SIN CAMBIOS ESTRUCTURALES) ===== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --cream:#f6f1e7;
  --soft-cream:#fffaf3;
  --eucalyptus:#8ba391;
  --eucalyptus-dark:#6f8776;
  --text:#5e665f;
  --white:#ffffff;
}

body{
  font-family:'Montserrat',sans-serif;
  color:var(--text);
  overflow-x:hidden;
  background:
  linear-gradient(rgba(246,241,231,0.72),rgba(246,241,231,0.82)),
  url('foto_bailando.jpg') center center/cover fixed no-repeat;
}

body.no-scroll{
  overflow:hidden;
}

/* ===== LANGUAGE ===== */

#language-selector{
  position:fixed;
  inset:0;
  background:linear-gradient(rgba(246,241,231,0.97),rgba(246,241,231,0.97)),url('foto1.jpg') center center/cover;
  z-index:9999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#language-selector.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* ===== HERO FIX (BAJA TEXTO PARA NO TAPAR CARAS) ===== */

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  text-align:center;
  padding-top:260px; /* 🔥 MÁS BAJO */
  position:relative;
}

.hero-content{
  width:100%;
  position:relative;
  z-index:2;
  transform:translateY(40px);
}

/* ===== TIMER ===== */

#timer{
  margin-bottom:90px; /* 🔥 BAJADO */
}

/* ===== BOTONES ===== */

.btn{
  cursor:pointer;
}

/* ===== COPY FEEDBACK ===== */

#copyMessage{
  opacity:0;
  transition:.3s;
}

</style>
</head>

<body class="no-scroll">

<!-- LANGUAGE -->
<div id="language-selector">
<h2>Choose Language</h2>

<div class="lang-buttons">
<button onclick="setLanguage('es')" class="lang-btn">Español</button>
<button onclick="setLanguage('en')" class="lang-btn">English</button>
<button onclick="setLanguage('fr')" class="lang-btn">Français</button>
<button onclick="setLanguage('it')" class="lang-btn">Italiano</button>
<button onclick="setLanguage('kr')" class="lang-btn">한국어</button>
</div>
</div>

<!-- HERO -->
<section class="hero">
<div class="hero-content">

<div id="timer"></div>

<p id="heroSubtitle">WE ARE GETTING MARRIED</p>

<h1>Patricia & Hyo Hwan</h1>

<p id="dateText">26 · September · 2026</p>

</div>
</section>

<!-- STORY -->
<section>
<h2 class="section-title" id="storyTitle"></h2>
<p class="intro" id="storyText"></p>
</section>

<!-- DETAILS -->
<section>
<h2 class="section-title" id="detailsTitle"></h2>

<div class="details-grid">

<div class="card">
<h3 id="ceremonyTitle"></h3>
<p>17:30h</p>
<p id="ceremonyPlace"></p>
</div>

<div class="card">
<h3 id="partyTitle"></h3>
<p id="partyText1"></p>
<p id="partyText2"></p>
</div>

<div class="card">
<h3 id="dressTitle"></h3>
<p id="dressText1"></p>
<p id="dressText2"></p>
</div>

</div>

<!-- HOTELS + PDF FIX -->
<div class="details-grid">

<div class="card">

<h3 id="stayTitle"></h3>

<p id="stayText"></p>

<p>Hotel Amistad Murcia</p>
<a class="btn" target="_blank"
href="Descuentos en hotel para vosotros.pdf">
Hotel PDF
</a>

<p style="margin-top:20px;">Cetina Murcia</p>
<a class="btn" target="_blank"
href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf">
Hotel PDF
</a>

</div>

</div>
</section>

<!-- MUSIC -->
<section>
<h2 class="section-title" id="musicTitle"></h2>

<a class="btn" target="_blank"
href="https://open.spotify.com/playlist/6rd8snJhjojWvrsnHi6Zfe">
Spotify Playlist
</a>
</section>

<!-- RSVP -->
<section>
<h2 class="section-title" id="confirmTitle"></h2>

<a class="btn" target="_blank"
href="https://forms.gle/VbBLwKAwJP2qk6uT9">
RSVP
</a>
</section>

<!-- GIFTS -->
<section>

<h2 class="section-title">Regalos</h2>

<div class="card">

<p>IBAN: ESXX XXXX XXXX XXXX</p>
<button class="btn" onclick="copyIBAN()">Copiar IBAN</button>

<p style="margin-top:20px;">SWIFT: XXXXESXX</p>
<button class="btn" onclick="copySWIFT()">Copiar SWIFT</button>

<p id="copyMessage">✓ Copiado</p>

</div>

</section>

<!-- AUDIO -->
<audio id="bg-music" loop>
<source src="Lavieenrose.mp3" type="audio/mpeg">
</audio>

<script>

/* MUSIC FIX */
const audio=document.getElementById("bg-music");
audio.volume=0.3;

/* AUTO PLAY FIX */
window.addEventListener("click",()=>{
audio.play().catch(()=>{});
},{once:true});

/* LANGUAGE FIX */
function setLanguage(lang){

document.getElementById("language-selector").classList.add("hidden");
document.body.classList.remove("no-scroll");

audio.play().catch(()=>{});

}

/* COUNTDOWN FIX */
const weddingDate=new Date("2026-09-26T17:30:00").getTime();

setInterval(()=>{

const now=new Date().getTime();
const diff=weddingDate-now;

const months=Math.floor(diff/(1000*60*60*24*30));
const days=Math.floor((diff/(1000*60*60*24))%30);
const hours=Math.floor((diff/(1000*60*60))%24);

document.getElementById("timer").innerHTML=
`${months} meses · ${days} días · ${hours}h`;

},1000);

/* COPY */
function copyIBAN(){
navigator.clipboard.writeText("ESXX XXXX XXXX XXXX");
document.getElementById("copyMessage").style.opacity=1;
setTimeout(()=>document.getElementById("copyMessage").style.opacity=0,2000);
}

function copySWIFT(){
navigator.clipboard.writeText("XXXXESXX");
document.getElementById("copyMessage").style.opacity=1;
setTimeout(()=>document.getElementById("copyMessage").style.opacity=0,2000);
}

</script>

</body>
</html>
