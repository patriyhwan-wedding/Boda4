function setLang(lang){

currentLang = lang;

document.getElementById("languageModal").style.display="none";

const music=document.getElementById("bgMusic");

music.volume=0.25;

music.play().catch(()=>{});

const t=translations[lang] || translations.es;

Object.keys(t).forEach(id=>{

const el=document.getElementById(id);

if(el){
el.innerHTML=t[id];
}

});

updateCountdown();

}

function toggleMusic(){

const music=document.getElementById("bgMusic");

if(music.paused){
music.play();
}else{
music.pause();
}

}

const targetDate=new Date("2026-09-26T18:30:00");

function updateCountdown(){


  const now = new Date();
  const target = new Date("2026-09-26T18:30:00");

  let years = target.getFullYear() - now.getFullYear();
  let months = target.getMonth() - now.getMonth();
  let days = target.getDate() - now.getDate();
  let hours = target.getHours() - now.getHours();

  if (hours < 0) {
    hours += 24;
    days--;
  }

  if (days < 0) {
    const prevMonth = new Date(target.getFullYear(), target.getMonth(), 0).getDate();
    days += prevMonth;
    months--;
  }

  if (months < 0) {
    months += 12;
    years--;
  }

  const t = translations[currentLang] || translations.es;

  const totalMonths = years * 12 + months;

  document.getElementById("timer").innerHTML =
    `${totalMonths} ${t.months} · ${days} ${t.days} · ${hours} ${t.hours}`;

}

setInterval(updateCountdown,1000);

function copyIBAN(){

navigator.clipboard.writeText(
document.getElementById("ibanText").innerText
);

showCopied();

}

function copySWIFT(){

navigator.clipboard.writeText(
document.getElementById("swiftText").innerText
);

showCopied();

}

function showCopied(){

const msg=document.getElementById("copyMessage");

msg.innerHTML = translations[currentLang].copied;

msg.style.opacity="1";

setTimeout(()=>{
msg.style.opacity="0";
},2000);

}

updateCountdown();



</script>
