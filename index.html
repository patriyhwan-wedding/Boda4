<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyo Hwan & Patricia</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE
========================= */

*{margin:0;padding:0;box-sizing:border-box;}

:root{
--green:#8ba391;
--green-dark:#5f7567;
--text:#4d5a52;
}

body{
font-family:'Montserrat',sans-serif;
color:white;
overflow-x:hidden;

/* FOTO ORIGINAL + CONTRASTE MÁS ELEGANTE */
background:
linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.35)),
url('foto_bailando.jpg') center/cover fixed;
}

/* =========================
   LANGUAGE
========================= */

#language-selector{
position:fixed;inset:0;
background:rgba(255,255,255,0.95);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

#language-selector.hidden{
display:none;
}

.lang-btn{
margin:8px;
padding:14px 28px;
border-radius:999px;
border:1px solid #ddd;
background:white;
cursor:pointer;
transition:0.3s;
}

.lang-btn:hover{
background:var(--green);
color:white;
transform:translateY(-3px);
}

/* =========================
   HERO (BAJADO PARA NO TAPAR CARA)
========================= */

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero-content{
transform:translateY(130px);
}

.hero h1{
font-size:4.5rem;
font-family:'Cormorant Garamond',serif;
text-shadow:0 8px 25px rgba(0,0,0,0.5);
}

#timer{
background:rgba(255,255,255,0.2);
padding:10px 20px;
border-radius:999px;
display:inline-block;
margin-bottom:20px;
}

/* =========================
   SECCIONES (CARDS)
========================= */

section{
max-width:1100px;
margin:auto;
padding:90px 20px;
}

.section-title{
text-align:center;
font-size:3rem;
margin-bottom:40px;
font-family:'Cormorant Garamond',serif;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,0.85);
color:#3d4a44;
padding:25px;
border-radius:18px;
text-align:center;
}

/* BUTTON */
.btn{
display:inline-block;
margin-top:10px;
padding:12px 24px;
border-radius:999px;
background:var(--green);
color:white;
text-decoration:none;
}

/* MUSIC */
#musicBtn{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
border-radius:50%;
background:var(--green);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:18px;
}

</style>
</head>

<body class="no-scroll">

<!-- LANGUAGE -->
<div id="language-selector">
<h2>Choose Language</h2>
<button class="lang-btn" onclick="setLanguage('es')">Español</button>
<button class="lang-btn" onclick="setLanguage('en')">English</button>
<button class="lang-btn" onclick="setLanguage('fr')">Français</button>
<button class="lang-btn" onclick="setLanguage('it')">Italiano</button>
<button class="lang-btn" onclick="setLanguage('kr')">한국어</button>
</div>

<!-- HERO -->
<section class="hero">
<div class="hero-content">
<div id="timer"></div>
<h1>Hyo Hwan & Patricia</h1>
<p id="dateText">26 · Septiembre · 2026</p>
</div>
</section>

<!-- STORY -->
<section>
<h2 class="section-title" id="storyTitle"></h2>
<p id="storyText" style="text-align:center;max-width:700px;margin:auto;"></p>
</section>

<!-- DETAILS -->
<section>
<h2 class="section-title" id="detailsTitle"></h2>

<div class="grid">

<div class="card">
<h3 id="ceremonyTitle"></h3>
<p>17:30h</p>
<p>En la misma finca</p>
</div>

<div class="card">
<h3 id="partyTitle"></h3>
<p id="partyText1"></p>
<p id="partyText2"></p>
</div>

<div class="card">
<h3 id="dressTitle"></h3>
<p id="dressText1"></p>
<p id="dressText2"></p>
</div>

</div>
</section>

<!-- HOTELS -->
<section>
<h2 class="section-title" id="stayTitle"></h2>

<div class="grid">

<div class="card">
<p>Hotel descuentos</p>
<a class="btn" target="_blank" href="Descuentos en hotel para vosotros.pdf">PDF</a>
</div>

<div class="card">
<p>Cetina 2026</p>
<a class="btn" target="_blank" href="CETINA 2026 - SIEMPREVERDE-EL BOSCO.pdf">PDF</a>
</div>

</div>
</section>

<!-- LOCATION -->
<section>
<h2 class="section-title">Ubicación</h2>

<div class="grid">

<div class="card">
<p>Finca Siempre Verde</p>
<a class="btn" target="_blank"
href="https://www.google.com/maps/search/?api=1&query=Finca+Siempre+Verde+Murcia">
Google Maps
</a>
</div>

<div class="card">
<p>Aeropuerto: Alicante (ALC)</p>
</div>

<div class="card">
<p>Taxi · Uber · Cabify · Bolt</p>
</div>

</div>
</section>

<!-- GIFTS -->
<section>
<h2 class="section-title">Regalos</h2>

<div class="grid">

<div class="card">
<p><b>IBAN:</b> ESXX XXXX XXXX</p>
<button class="btn" onclick="copyIBAN()">Copiar</button>
</div>

<div class="card">
<p><b>SWIFT:</b> XXXXESXX</p>
<button class="btn" onclick="copySWIFT()">Copiar</button>
</div>

</div>
</section>

<!-- MUSIC -->
<div id="musicBtn" onclick="toggleMusic()">🎵</div>

<audio id="bg-music" loop>
<source src="Lavieenrose.mp3">
</audio>

<footer style="text-align:center;padding:40px;">
Hecho con amor
</footer>

<script>

/* =========================
   TRANSLATIONS (COMPLETO REAL)
========================= */

const translations = {

es:{
storyTitle:"Nuestra Historia",
storyText:"Dos caminos se cruzaron en el momento perfecto...",
detailsTitle:"Detalles",
ceremonyTitle:"Ceremonia",
partyTitle:"Celebración",
partyText1:"Cena & fiesta",
partyText2:"Hasta el amanecer ✨",
dressTitle:"Dress Code",
dressText1:"Libre",
dressText2:"Elegante"
},

en:{
storyTitle:"Our Story",
storyText:"Two paths crossed at the perfect moment...",
detailsTitle:"Details",
ceremonyTitle:"Ceremony",
partyTitle:"Celebration",
partyText1:"Dinner & party",
partyText2:"Until sunrise ✨",
dressTitle:"Dress Code",
dressText1:"Free",
dressText2:"Elegant"
},

fr:{
storyTitle:"Notre Histoire",
storyText:"Deux chemins se sont croisés...",
detailsTitle:"Détails",
ceremonyTitle:"Cérémonie",
partyTitle:"Fête",
partyText1:"Dîner",
partyText2:"Jusqu’au matin ✨",
dressTitle:"Dress Code",
dressText1:"Libre",
dressText2:"Élégant"
},

it:{
storyTitle:"La Nostra Storia",
storyText:"Due strade si sono incrociate...",
detailsTitle:"Dettagli",
ceremonyTitle:"Cerimonia",
partyTitle:"Festa",
partyText1:"Cena",
partyText2:"Fino all’alba ✨",
dressTitle:"Dress Code",
dressText1:"Libero",
dressText2:"Elegante"
},

kr:{
storyTitle:"우리 이야기",
storyText:"두 사람이 완벽한 순간에 만났습니다...",
detailsTitle:"정보",
ceremonyTitle:"예식",
partyTitle:"파티",
partyText1:"저녁",
partyText2:"새벽까지 ✨",
dressTitle:"드레스",
dressText1:"자유",
dressText2:"우아함"
}

};

/* =========================
   LANGUAGE FUNCTION (ARREGLADO)
========================= */

function setLanguage(lang){

document.getElementById("language-selector").classList.add("hidden");
document.body.classList.remove("no-scroll");

Object.keys(translations[lang]).forEach(id=>{
const el=document.getElementById(id);
if(el) el.innerHTML = translations[lang][id];
});

audio.play().catch(()=>{});

}

/* =========================
   MUSIC
========================= */

const audio=document.getElementById("bg-music");

function toggleMusic(){
audio.volume=0.3;
if(audio.paused) audio.play();
else audio.pause();
}

/* =========================
   COUNTDOWN
========================= */

const wedding=new Date("2026-09-26T17:30:00").getTime();

setInterval(()=>{
const now=new Date().getTime();
const d=wedding-now;

const m=Math.floor(d/(1000*60*60*24*30));
const da=Math.floor((d/(1000*60*60*24))%30);
const h=Math.floor((d/(1000*60*60))%24);

document.getElementById("timer").innerHTML=
`${m}m · ${da}d · ${h}h`;

},1000);

</script>

</body>
</html>
